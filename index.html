<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Plan the fastest or safest Escape from Tarkov Battle Pass document farming route."
    />
    <title>KORD BREACH Optimizer</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/typography.css" />
    <link rel="stylesheet" href="./src/spacing.css" />
    <style>
      :root {
        --canvas-width: 94vw;
        --canvas-height: 94vh;
        --canvas-min-width: 1180px;
        --canvas-min-height: 720px;
        --workspace-height: clamp(500px, 62vh, 720px);
        --grid-gap: var(--space-m);
        --header-height: calc(var(--font-size-header) * 6);
        --header-body-font-size: var(--font-size-header);
        --header-label-font-size: calc(var(--font-size-header) * 0.8125);
        --header-display-font-size: calc(var(--font-size-header) * 2.956);
        --header-padding: var(--font-size-header);
        --header-small-gap: calc(var(--font-size-header) * 0.375);
        --header-control-gap: calc(var(--font-size-header) * 0.625);
        --header-content-gap: var(--font-size-header);
        --header-progress-gap: calc(var(--font-size-header) * 1.625);
        --header-help-size: calc(var(--font-size-header) * 1.3125);
        --header-control-min-width: calc(var(--font-size-header) * 4.75);
        --reward-column: 24.4fr;
        --focus-column: 50.3fr;
        --detail-column: 25.3fr;
        --section-heading-height: calc(var(--font-size-section-heading) * 3.375);
        --section-heading-inline-padding: var(--font-size-section-heading);
        --section-heading-content-gap: var(--font-size-section-heading);
        --section-label-font-size: calc(var(--font-size-section-heading) * 0.8125);
        --section-eyebrow-gap: calc(var(--font-size-section-heading) * 0.25);
        --section-action-height: calc(var(--font-size-section-heading) * 2.0625);
        --section-action-gap: calc(var(--font-size-section-heading) * 0.625);
        --section-action-inline-padding: var(--font-size-section-heading);
        --section-action-compact-inline-padding: calc(var(--font-size-section-heading) * 0.625);
        --document-strip-image-size: clamp(74px, 5vw, 96px);
        --header-control-padding-block: calc(var(--font-size-header) * 0.625);
        --header-control-padding-inline: calc(var(--font-size-header) * 0.875);
        --header-control-chevron-gap: var(--header-control-padding-inline);
        --header-control-chevron-correction: calc(var(--font-size-header) * 0.125);
        --line: #697078;
        --line-muted: #41464d;
        --surface: #17191c;
        --surface-alt: #1d2024;
        --label: #d7d9dc;
        --label-muted: #a8adb3;
        --season-accent: #428c73;
        --document-border: #95d6bc;
        --action-surface: #3f5960;
        --purchase-accent: #af8a45;
        --classified-frame: #8d5155;
        --reward-opportunity: var(--purchase-accent);
        --reward-complete-background:
          linear-gradient(
            90deg,
            color-mix(in srgb, var(--season-accent) 10%, transparent),
            color-mix(in srgb, var(--season-accent) 30%, transparent)
          );
        --reward-redeemable-background:
          linear-gradient(
            90deg,
            color-mix(in srgb, var(--season-accent) 6%, transparent),
            color-mix(in srgb, var(--season-accent) 16%, transparent)
          );
        --tooltip-surface: #050607;
        --tooltip-line: #777e84;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-width: var(--canvas-min-width);
        min-height: var(--canvas-min-height);
        margin: 0;
      }

      body {
        display: flow-root;
        min-block-size: 100vh;
        overflow: auto;
        background: #0f1012;
        color: var(--label);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", monospace;
      }

      .wireframe-shell {
        display: grid;
        grid-template-rows: var(--header-height) var(--workspace-height) auto;
        gap: var(--grid-gap);
        inline-size: var(--canvas-width);
        min-inline-size: calc(var(--canvas-min-width) - 6vw);
        block-size: auto;
        min-block-size: calc(var(--canvas-min-height) - 6vh);
        margin: 3vh auto;
      }

      .wireframe-header {
        position: relative;
        z-index: 10;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        column-gap: var(--header-content-gap);
        min-block-size: 0;
      }

      .wireframe-workspace {
        display: grid;
        grid-template-columns:
          var(--reward-column)
          var(--focus-column)
          var(--detail-column);
        column-gap: var(--grid-gap);
        min-block-size: 0;
      }

      .wireframe-workspace {
        grid-template-areas: "reward focus focus";
        grid-template-rows: minmax(0, 1fr);
      }

      .region,
      .slot {
        position: relative;
        min-inline-size: 0;
        min-block-size: 0;
      }

      .region {
        border: 1px solid var(--line);
        background:
          linear-gradient(135deg, transparent 0 49.8%, #22262a 50% 50.2%, transparent 50.4%)
            0 0 / 28px 28px,
          var(--surface);
      }

      .slot {
        background: color-mix(in srgb, var(--surface-alt) 82%, transparent);
      }

      .region-label,
      .slot-label {
        position: absolute;
        z-index: 1;
        inset-block-start: var(--space-s);
        inset-inline-start: var(--space-s);
        max-inline-size: calc(100% - (2 * var(--space-s)));
        padding: var(--space-xxs) var(--space-xs);
        background: var(--surface);
        color: var(--label);
        font-size: var(--font-size-label);
        font-weight: 700;
        line-height: var(--line-height-ui);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .slot-label {
        color: var(--label-muted);
        font-size: var(--font-size-caption);
        font-weight: 600;
      }

      .region > .region-label {
        inset-inline-start: auto;
        inset-inline-end: var(--space-s);
      }

      .header-slot {
        border: 0;
        background: transparent;
      }

      .header-summary {
        display: grid;
        grid-template-columns: minmax(220px, 0.7fr) minmax(350px, 1fr);
        align-items: center;
        gap: var(--header-content-gap);
      }

      .header-controls {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: var(--header-control-gap);
        padding: var(--header-control-gap);
      }

      .season-slot {
        position: relative;
        display: flex;
        align-items: center;
        gap: var(--header-content-gap);
        padding: var(--header-padding);
      }

      .season-number {
        padding-inline-end: var(--header-padding);
        border-inline-end: 1px solid var(--line-muted);
        color: var(--season-accent);
        font-size: var(--header-display-font-size);
        font-weight: 700;
        line-height: 0.81;
      }

      .season-details {
        display: grid;
        gap: var(--header-small-gap);
        min-inline-size: 0;
      }

      .season-name,
      .season-timer {
        white-space: nowrap;
      }

      .season-name {
        overflow: hidden;
        font-size: var(--header-body-font-size);
        letter-spacing: 0.08em;
        text-overflow: ellipsis;
      }

      .season-timer {
        color: var(--label-muted);
        font-size: var(--header-label-font-size);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.05em;
      }

      .season-help__trigger {
        display: grid;
        flex: 0 0 auto;
        place-items: center;
        inline-size: var(--header-help-size);
        block-size: var(--header-help-size);
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--label-muted);
        font: inherit;
        font-size: var(--header-label-font-size);
        font-weight: 700;
        line-height: 1;
        cursor: help;
      }

      .season-help__trigger:hover,
      .season-help__trigger:focus-visible {
        color: var(--document-border);
        outline: 0;
      }

      .season-help__icon {
        display: block;
        inline-size: 100%;
        block-size: 100%;
      }

      .season-help__tooltip {
        position: absolute;
        z-index: 20;
        inset-block-start: calc(100% + var(--header-small-gap));
        inset-inline-start: var(--header-padding);
        inline-size: min(352px, calc(100vw - (4 * var(--header-padding))));
        padding: var(--header-control-gap);
        border: 1px solid var(--tooltip-line);
        background: var(--tooltip-surface);
        color: var(--label-muted);
        font-size: var(--header-label-font-size);
        line-height: var(--line-height-body);
        opacity: 0;
        pointer-events: none;
        transform: translateY(calc(-1 * var(--header-small-gap)));
        white-space: pre-line;
        transition:
          opacity 120ms ease-out,
          transform 120ms ease-out;
      }

      .season-help:hover .season-help__tooltip,
      .season-help:focus-within .season-help__tooltip {
        opacity: 1;
        transform: translateY(0);
      }

      .primary-navigation-slot {
        display: grid;
        grid-template-columns: minmax(120px, 1fr) minmax(110px, 0.85fr);
        align-items: center;
        gap: var(--header-progress-gap);
        padding: var(--header-padding);
      }

      .navigation-progress {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: end;
        gap: var(--header-small-gap) var(--header-control-gap);
        min-inline-size: 0;
      }

      .navigation-progress__label {
        overflow: hidden;
        color: var(--label-muted);
        font-size: var(--header-label-font-size);
        font-weight: 700;
        line-height: var(--line-height-ui);
        letter-spacing: 0.08em;
        text-overflow: ellipsis;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .navigation-progress__label-line {
        display: flex;
        align-items: baseline;
        gap: var(--header-small-gap);
        min-inline-size: 0;
      }

      .navigation-progress__buyout {
        flex: 0 0 auto;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--purchase-accent);
        font: inherit;
        font-size: var(--header-label-font-size);
        font-weight: 700;
        line-height: var(--line-height-ui);
        text-decoration: underline;
        text-underline-offset: 0.2em;
        cursor: pointer;
      }

      .navigation-progress__buyout:hover {
        color: var(--label);
      }

      .navigation-progress__buyout:focus-visible {
        outline: 2px solid var(--label);
        outline-offset: var(--space-xxs);
      }

      .navigation-progress__value {
        color: var(--label);
        font-size: var(--header-label-font-size);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: var(--line-height-ui);
        white-space: nowrap;
      }

      .navigation-progress__separator {
        padding-inline: calc(var(--font-size-header) * 0.25);
        color: var(--label-muted);
      }

      .navigation-progress progress {
        grid-column: 1 / -1;
        inline-size: 100%;
        block-size: 4px;
        overflow: hidden;
        border: 0;
        border-radius: 0;
        appearance: none;
        background: var(--line-muted);
      }

      .navigation-progress progress::-webkit-progress-bar {
        background: var(--line-muted);
      }

      .navigation-progress progress::-webkit-progress-value {
        background: var(--label);
      }

      .navigation-progress progress::-moz-progress-bar {
        background: var(--label);
      }

      .route-profile-toggle {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        margin: 0;
        padding: 0;
        border: 1px solid var(--line-muted);
      }

      .route-profile-option {
        position: relative;
        cursor: pointer;
      }

      .route-profile-option + .route-profile-option {
        border-inline-start: 1px solid var(--line-muted);
      }

      .route-profile-option input {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        opacity: 0;
      }

      .route-profile-option__label {
        display: grid;
        place-items: center;
        min-inline-size: var(--header-control-min-width);
        padding-block: var(--header-control-padding-block);
        padding-inline: var(--header-control-padding-inline);
        color: var(--label-muted);
        font-size: var(--header-label-font-size);
        font-weight: 700;
        line-height: var(--line-height-ui);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .route-profile-option input:checked + .route-profile-option__label {
        background: var(--action-surface);
        color: var(--label);
      }

      .route-profile-option input:focus-visible + .route-profile-option__label {
        outline: 2px solid var(--label);
        outline-offset: 2px;
      }

      .route-profile-option__tooltip {
        position: absolute;
        z-index: 20;
        inset-block-start: calc(100% + var(--header-small-gap));
        inline-size: min(30ch, calc(100vw - (4 * var(--header-padding))));
        padding: var(--header-control-gap);
        border: 1px solid var(--tooltip-line);
        background: var(--tooltip-surface);
        box-shadow: 0 0.75rem 1.5rem rgb(0 0 0 / 45%);
        color: var(--label);
        font-size: var(--header-label-font-size);
        font-weight: 400;
        line-height: var(--line-height-copy);
        letter-spacing: normal;
        opacity: 0;
        pointer-events: none;
        text-transform: none;
        transform: translateY(calc(-1 * var(--header-small-gap)));
        transition: opacity 120ms ease, transform 120ms ease;
      }

      .route-profile-option:first-of-type .route-profile-option__tooltip {
        inset-inline-start: 0;
      }

      .route-profile-option:last-child .route-profile-option__tooltip {
        inset-inline-end: 0;
      }

      .route-profile-option:hover .route-profile-option__tooltip,
      .route-profile-option:focus-within .route-profile-option__tooltip {
        opacity: 1;
        transform: translateY(0);
      }

      .visually-hidden {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      .account-slot {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: var(--header-control-gap);
        padding: 0;
      }

      .header-select-shell,
      .ss-main.header-select,
      .ss-content.header-select {
        color: var(--label);
        font-family: inherit;
        font-size: var(--header-label-font-size);
        font-weight: 700;
        --ss-bg-color: var(--surface);
        --ss-border-color: var(--line-muted);
        --ss-focus-color: var(--label);
        --ss-font-color: var(--label);
        --ss-main-height: auto;
        --ss-option-height: auto;
        --ss-primary-color: var(--line-muted);
        --ss-spacing-s: 0px;
        --ss-spacing-m: var(--header-small-gap);
        --ss-spacing-l: var(--header-control-gap);
      }

      .ss-main.header-select {
        inline-size: max-content;
        padding-block: var(--header-control-padding-block);
        padding-inline-start: var(--header-control-padding-inline);
        padding-inline-end: calc(
          var(--header-control-padding-inline) - var(--header-control-chevron-correction)
        );
        border-radius: 0;
      }

      .ss-main.header-select:focus {
        box-shadow: 0 0 0 2px var(--label);
      }

      .ss-main.header-select .ss-values {
        flex: 0 1 auto;
        padding: 0;
      }

      .ss-main.header-select .ss-values .ss-single {
        display: flex;
        flex: 0 1 auto;
        align-items: center;
        inline-size: auto;
        max-inline-size: none;
        padding: 0;
        line-height: var(--line-height-ui);
      }

      .ss-main.header-select .ss-arrow {
        inline-size: 10px;
        block-size: 10px;
        margin: 0 0 0 var(--header-control-chevron-gap);
      }

      .ss-main.header-select .ss-arrow path {
        stroke: var(--label-muted);
      }

      .ss-content.header-select {
        border-radius: 0;
      }

      .ss-content.header-select .ss-list .ss-option {
        min-block-size: var(--ss-option-height);
        padding-block: var(--header-control-padding-block);
        padding-inline: var(--header-control-padding-inline);
        color: var(--label);
        line-height: var(--line-height-ui);
      }

      .ss-content.header-select .ss-list .ss-option:hover:not(.ss-disabled),
      .ss-content.header-select .ss-list .ss-option.ss-highlighted,
      .ss-content.header-select .ss-list .ss-option:not(.ss-disabled).ss-selected {
        border-inline-start: 0;
        background: var(--action-surface);
        color: var(--label);
      }

      .mode-select-shell,
      .language-select-shell {
        inline-size: fit-content;
      }

      .ss-main.language-select .ss-single,
      .ss-content.language-select .ss-option {
        justify-content: center;
      }

      .locale-choice {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: var(--header-small-gap);
        min-block-size: calc(var(--header-label-font-size) * var(--line-height-ui));
      }

      .locale-choice__flag {
        display: block;
        inline-size: auto;
        block-size: var(--header-label-font-size);
        flex: 0 0 auto;
      }

      .locale-choice__name {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      .reward-rail {
        grid-area: reward;
        display: grid;
        grid-template-rows: var(--section-heading-height) minmax(0, 1fr);
      }

      .focus-stage {
        grid-area: focus;
        display: grid;
        grid-template-rows: var(--section-heading-height) minmax(0, 1fr) auto;
      }

      .focus-heading {
        padding: 0 var(--section-heading-inline-padding);
        border-block-end-style: solid;
      }

      .wireframe-shell[data-app-pending] {
        display: none;
      }

      .focus-heading,
      .focus-content {
        transition:
          filter 120ms ease-out,
          opacity 120ms ease-out;
      }

      .focus-stage--loading > .focus-heading,
      .focus-stage--loading > .focus-content {
        filter: saturate(0.55);
        opacity: 0.48;
      }

      .focus-heading {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: var(--section-heading-content-gap);
      }

      .focus-heading h2 {
        margin: 0;
        font-size: var(--font-size-section-heading);
        line-height: var(--line-height-ui);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .focus-heading__eyebrow {
        display: block;
        margin-block-end: var(--section-eyebrow-gap);
        color: var(--label-muted);
        font-size: var(--section-label-font-size);
        font-weight: 700;
        line-height: var(--line-height-ui);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .focus-heading__actions {
        display: flex;
        align-items: center;
        gap: var(--section-action-gap);
      }

      .focus-heading__actions button {
        block-size: var(--section-action-height);
        padding: 0 var(--section-action-inline-padding);
        border: 1px solid var(--line-muted);
        border-radius: 0;
        background: transparent;
        color: var(--label);
        font: inherit;
        font-size: var(--section-label-font-size);
        font-weight: 700;
        line-height: var(--line-height-ui);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        white-space: nowrap;
        cursor: pointer;
      }

      .focus-heading__actions [data-commit-raid] {
        border-color: var(--action-surface);
        background: var(--action-surface);
      }

      .focus-heading__actions button:hover,
      .focus-heading__actions button:focus-visible {
        border-color: var(--label-muted);
        background: var(--line-muted);
        outline: 0;
      }

      .focus-heading__actions [data-commit-raid]:hover,
      .focus-heading__actions [data-commit-raid]:focus-visible {
        background: color-mix(in srgb, var(--action-surface) 82%, var(--label));
      }

      .focus-heading__actions button:disabled {
        border-color: var(--line-muted);
        background: transparent;
        color: var(--label-muted);
        cursor: default;
        opacity: 0.55;
      }

      .focus-content {
        display: grid;
        align-content: center;
        gap: var(--space-l);
        padding: var(--space-m);
        overflow: auto;
        border-block-end: 0;
        background: color-mix(in srgb, var(--surface) 94%, transparent);
      }

      .focus-loading,
      .focus-message {
        margin: 0;
        color: var(--label-muted);
        font-size: var(--font-size-body);
        line-height: var(--line-height-body);
        text-align: center;
      }

      .focus-message strong {
        display: block;
        margin-block-end: var(--space-xs);
        color: var(--label);
        font-size: var(--font-size-heading);
        line-height: var(--line-height-ui);
      }

      .focus-instruction {
        margin: 0;
        color: var(--label-muted);
        font-size: var(--font-size-label);
        line-height: var(--line-height-body);
        text-align: center;
      }

      .focus-instruction__commit {
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--season-accent);
        font: inherit;
        font-weight: 700;
        text-decoration: underline;
        text-underline-offset: 0.2em;
        cursor: pointer;
      }

      .focus-instruction__commit:hover {
        color: var(--label);
      }

      .focus-instruction__commit:focus-visible {
        outline: 2px solid var(--label);
        outline-offset: var(--space-xxs);
      }

      .focus-documents {
        display: grid;
        grid-template-columns: repeat(2, minmax(118px, 140px));
        justify-content: center;
        gap: var(--space-xl);
      }

      .focus-document {
        display: grid;
        align-content: start;
        gap: var(--space-s);
        min-inline-size: 0;
        margin: 0;
      }

      .focus-document__status {
        min-block-size: 1lh;
        color: var(--season-accent);
        font-size: var(--font-size-caption);
        font-weight: 700;
        line-height: var(--line-height-ui);
        letter-spacing: 0.08em;
        text-align: center;
        text-transform: uppercase;
      }

      .focus-document--optional .focus-document__status {
        color: var(--label-muted);
      }

      .focus-document__image-frame {
        position: relative;
        aspect-ratio: 1;
        overflow: hidden;
        border: 2px solid var(--document-border);
        background: var(--surface-alt);
        transition:
          filter 120ms ease-out,
          opacity 120ms ease-out;
      }

      .focus-document--optional .focus-document__image-frame {
        border-color: var(--line-muted);
        filter: grayscale(0.88);
        opacity: 0.34;
      }

      .focus-document__image-frame img {
        display: block;
        inline-size: 100%;
        block-size: 100%;
        object-fit: cover;
      }

      .focus-document figcaption {
        min-block-size: 1lh;
        text-align: center;
      }

      .focus-document figcaption strong {
        overflow-wrap: anywhere;
        font-size: var(--font-size-label);
        line-height: var(--line-height-ui);
      }

      .raid-result-stepper {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        border: 1px solid var(--line-muted);
        background: var(--surface-alt);
      }

      .raid-result-stepper button,
      .raid-result-stepper input {
        min-inline-size: 0;
        block-size: 2.618em;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: var(--label);
        font: inherit;
        font-size: var(--font-size-label);
        font-variant-numeric: tabular-nums;
        line-height: 1;
        text-align: center;
      }

      .raid-result-stepper button {
        inline-size: 2.618em;
        cursor: pointer;
      }

      .raid-result-stepper button:hover {
        background: var(--line-muted);
      }

      .raid-result-stepper input {
        inline-size: 100%;
        border-inline: 1px solid var(--line-muted);
        appearance: textfield;
      }

      .raid-result-stepper input::-webkit-inner-spin-button,
      .raid-result-stepper input::-webkit-outer-spin-button {
        appearance: none;
      }

      .raid-result-stepper button:focus-visible,
      .raid-result-stepper input:focus-visible {
        outline: 2px solid var(--label);
        outline-offset: 2px;
      }

      .route-schedule-dialog,
      .buyout-dialog {
        inline-size: min(900px, calc(100vw - (2 * var(--space-xl))));
        max-block-size: min(760px, calc(100dvh - (2 * var(--space-xl))));
        padding: 0;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 0;
        background: var(--surface);
        color: var(--label);
      }

      .route-schedule-dialog[open],
      .buyout-dialog[open] {
        display: flex;
        flex-direction: column;
      }

      .route-schedule-dialog::backdrop,
      .buyout-dialog::backdrop {
        background: rgb(0 0 0 / 72%);
      }

      .route-schedule-dialog > header,
      .buyout-dialog > header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-m);
        padding: var(--space-m);
        border-block-end: 1px solid var(--line-muted);
      }

      .route-schedule-dialog h2,
      .buyout-dialog h2 {
        margin: 0;
        font-size: var(--font-size-heading);
      }

      .route-schedule-dialog header strong {
        display: block;
        margin-block-start: var(--space-xxs);
        color: var(--season-accent);
        font-size: var(--font-size-label);
      }

      .route-schedule-dialog header button,
      .buyout-dialog header button {
        display: grid;
        place-items: center;
        inline-size: var(--section-action-height);
        block-size: var(--section-action-height);
        padding: 0;
        border: 1px solid var(--line-muted);
        border-radius: 0;
        background: transparent;
        color: var(--label);
        font: inherit;
        font-size: var(--font-size-caption);
        line-height: 1;
        cursor: pointer;
      }

      .dialog-close__icon {
        display: block;
        inline-size: 20px;
        block-size: 20px;
        transform: translateX(-0.5px);
      }

      [data-route-schedule-content],
      [data-buyout-content] {
        min-block-size: 0;
        padding: 0 var(--space-m);
        overflow: auto;
        scrollbar-color: var(--line) var(--surface);
        scrollbar-width: thin;
        scrollbar-gutter: stable;
      }

      .schedule-plan-actions,
      .buyout-section {
        padding-block: var(--space-m);
        border-block-end: 1px solid var(--line-muted);
      }

      .schedule-estimate-note {
        margin: 0;
        padding-block: var(--space-m);
        border-block-end: 1px solid var(--line-muted);
        color: var(--label-muted);
        font-size: var(--font-size-caption);
        line-height: var(--line-height-body);
      }

      .schedule-plan-actions h3,
      .buyout-section h3 {
        margin: 0 0 var(--space-s);
        font-size: var(--font-size-label);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .schedule-plan-actions h4,
      .schedule-day-column h4,
      .buyout-section h4 {
        margin: 0 0 var(--space-xs);
        color: var(--label-muted);
        font-size: var(--font-size-caption);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .schedule-plan-actions ul,
      .schedule-day-column ul,
      .buyout-section ul {
        display: grid;
        gap: var(--space-xs);
        margin: 0;
        padding-inline-start: var(--space-l);
      }

      .schedule-plan-actions li,
      .schedule-day-column li,
      .buyout-section li,
      .buyout-section p {
        color: var(--label-muted);
        font-size: var(--font-size-caption);
        line-height: var(--line-height-body);
      }

      .schedule-day-column li strong,
      .schedule-day-column li span {
        display: block;
      }

      .schedule-day-column li strong {
        color: var(--label);
      }

      .schedule-day-column li span {
        margin-block-start: var(--space-xxs);
      }

      .schedule-reward-pages {
        display: grid;
        gap: var(--space-m);
      }

      .schedule-reward-page {
        display: grid;
        gap: var(--space-xs);
      }

      .schedule-reward-page__heading {
        display: flex;
        align-items: center;
        gap: var(--space-s);
        margin: 0;
        color: var(--season-accent);
        font-size: var(--font-size-label);
        letter-spacing: 0.06em;
        line-height: var(--line-height-ui);
        text-transform: uppercase;
      }

      .schedule-reward-page__heading::after {
        flex: 1;
        block-size: 1px;
        background: var(--line-muted);
        content: '';
      }

      .schedule-action-group + .schedule-action-group {
        margin-block-start: var(--space-m);
      }

      .schedule-projection-day {
        display: grid;
        gap: var(--space-s);
        padding-block: var(--space-m);
        border-block-end: 1px solid var(--line-muted);
      }

      .schedule-projection-day h3,
      .schedule-projection-day p,
      .schedule-projection-day ul {
        margin: 0;
      }

      .schedule-projection-day h3 {
        font-size: var(--font-size-label);
      }

      .schedule-projection-day__columns {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: var(--space-l);
      }

      .schedule-day-column + .schedule-day-column {
        padding-inline-start: var(--space-l);
        border-inline-start: 1px solid var(--line-muted);
      }

      .buyout-section p {
        margin: 0;
      }

      .buyout-section p + p,
      .buyout-section p + ul,
      .buyout-section ul + p {
        margin-block-start: var(--space-s);
      }

      .buyout-scenario {
        display: grid;
        gap: var(--space-m);
      }

      .buyout-scenario + .buyout-scenario {
        margin-block-start: var(--space-l);
      }

      .buyout-scenario h3 {
        margin: 0;
        color: var(--season-accent);
      }

      .buyout-table {
        inline-size: 100%;
        border-collapse: collapse;
        color: var(--label-muted);
        font-size: var(--font-size-caption);
        font-variant-numeric: tabular-nums;
        line-height: var(--line-height-ui);
        table-layout: fixed;
      }

      .buyout-table caption {
        padding-block-end: var(--space-xs);
        color: var(--label);
        font-size: var(--font-size-label);
        font-weight: 700;
        text-align: start;
      }

      .buyout-table th,
      .buyout-table td {
        padding: var(--space-xs) var(--space-s);
        border-block-end: 1px solid var(--line-muted);
        text-align: end;
        white-space: nowrap;
      }

      .buyout-table th:first-child,
      .buyout-table td:first-child {
        padding-inline-start: 0;
        text-align: start;
        white-space: normal;
      }

      .buyout-table th:last-child,
      .buyout-table td:last-child {
        padding-inline-end: 0;
      }

      .buyout-table thead th {
        color: var(--label-muted);
        font-weight: 400;
      }

      .buyout-table tbody th,
      .buyout-table tfoot th,
      .buyout-table tfoot td {
        color: var(--label);
        font-weight: 700;
      }

      .buyout-table tfoot th,
      .buyout-table tfoot td {
        border-block-end: 0;
      }

      .buyout-table__empty {
        color: var(--label-muted);
        text-align: start !important;
        white-space: normal !important;
      }

      .section-heading,
      .detail-content,
      .primary-action {
        border-block-end: 1px dashed var(--line-muted);
      }

      .reward-heading {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: var(--section-action-gap);
        padding: 0 var(--section-heading-inline-padding);
        border-block-end-style: solid;
      }

      .reward-heading h2 {
        margin: 0;
        overflow: hidden;
        font-size: var(--font-size-section-heading);
        line-height: var(--line-height-ui);
        letter-spacing: 0.06em;
        text-overflow: ellipsis;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .reward-heading__actions {
        display: flex;
        gap: var(--section-action-gap);
      }

      .reward-heading__actions button,
      .reward-page__trigger {
        border: 0;
        border-radius: 0;
        background: transparent;
        color: var(--label);
        font: inherit;
        cursor: pointer;
      }

      .reward-heading__actions button {
        block-size: var(--section-action-height);
        padding: 0 var(--section-action-compact-inline-padding);
        border: 1px solid var(--action-surface);
        background: var(--action-surface);
        font-size: var(--section-label-font-size);
        font-weight: 700;
        line-height: var(--line-height-ui);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .reward-heading__actions button:hover,
      .reward-heading__actions button:focus-visible {
        border-color: var(--label-muted);
        background: color-mix(in srgb, var(--action-surface) 82%, var(--label));
      }

      .reward-heading__actions button:disabled {
        opacity: 0.45;
        cursor: default;
      }

      .reward-content {
        overflow: auto;
        border-block-end: 0;
        background: color-mix(in srgb, var(--surface) 92%, transparent);
        scrollbar-color: var(--line) var(--surface);
        scrollbar-width: thin;
      }

      .reward-page + .reward-page {
        border-block-start: 1px solid var(--line-muted);
      }

      .reward-page__trigger {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        align-items: center;
        gap: var(--space-m);
        inline-size: 100%;
        padding: var(--space-s) var(--space-m);
        text-align: start;
      }

      .reward-page__chevron {
        display: block;
        inline-size: 0.75em;
        block-size: 0.75em;
        color: var(--label-muted);
        transform: rotate(0deg);
        transform-origin: center;
        transition: transform 120ms ease-out;
      }

      .reward-page__trigger[aria-expanded="true"] {
        background: color-mix(in srgb, var(--action-surface) 62%, transparent);
      }

      .reward-page--complete .reward-page__trigger,
      .reward-page--complete .reward-page__trigger[aria-expanded="true"] {
        background: var(--reward-complete-background);
      }

      .reward-page__trigger[aria-expanded="true"] .reward-page__chevron {
        transform: rotate(180deg);
      }

      .reward-page__label {
        font-size: var(--font-size-label);
        font-weight: 700;
        line-height: var(--line-height-ui);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .reward-page__redeemable {
        color: var(--season-accent);
        font-size: var(--font-size-caption);
        letter-spacing: 0.04em;
      }

      .reward-page__redeemable--locked {
        color: var(--reward-opportunity);
      }

      .reward-page__count {
        color: var(--label-muted);
        font-size: var(--font-size-caption);
        font-variant-numeric: tabular-nums;
        font-weight: 700;
        line-height: var(--line-height-ui);
      }

      .reward-page__panel[hidden] {
        display: none;
      }

      .reward-page__items {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .reward-item {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        border-block-start: 1px solid color-mix(in srgb, var(--line-muted) 68%, transparent);
      }

      .reward-item::after {
        position: absolute;
        z-index: 2;
        inset-block-start: 50%;
        inset-inline-end: var(--space-l);
        inline-size: 0.55rem;
        block-size: 1rem;
        border-right: 0.15rem solid var(--document-border);
        border-bottom: 0.15rem solid var(--document-border);
        content: "";
        opacity: 0;
        pointer-events: none;
        transform: translateY(-62%) rotate(45deg);
        transition: opacity 120ms ease-out;
      }

      .reward-item label {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        align-items: center;
        padding-block: var(--space-s);
        padding-inline: var(--space-m) var(--space-xl);
        cursor: pointer;
      }

      .reward-item input {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      .reward-item:has(input:focus-visible) {
        outline: 1px solid var(--label);
        outline-offset: -2px;
      }

      .reward-item__copy {
        display: grid;
        gap: var(--space-xxs);
        min-inline-size: 0;
      }

      .reward-item__name,
      .reward-item__requirements {
        overflow-wrap: anywhere;
      }

      .reward-item__name {
        font-size: var(--font-size-label);
        font-weight: 700;
        line-height: var(--line-height-ui);
      }

      .reward-item__requirements {
        color: var(--label-muted);
        font-size: var(--font-size-caption);
        line-height: var(--line-height-ui);
      }

      .reward-item--redeemable {
        background: var(--reward-redeemable-background);
      }

      .reward-item:has(input:checked) {
        background: var(--reward-complete-background);
      }

      .reward-item:has(input:checked)::after {
        opacity: 0.78;
      }

      .reward-item:has(input:checked) .reward-item__name {
        color: color-mix(in srgb, var(--label) 78%, var(--season-accent));
      }

      .reward-item:has(input:checked) .reward-item__requirements {
        color: color-mix(in srgb, var(--label-muted) 72%, var(--season-accent));
      }

      .reward-crate {
        display: grid;
        gap: var(--space-xxs);
        padding: var(--space-m);
      }

      .redemption-dialog {
        inline-size: min(30rem, calc(100vw - (2 * var(--space-l))));
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 0;
        background: var(--surface);
        color: var(--label);
        box-shadow: 0 1rem 3rem rgb(0 0 0 / 55%);
      }

      .redemption-dialog::backdrop {
        background: rgb(4 7 9 / 78%);
      }

      .redemption-dialog__content {
        display: grid;
        gap: var(--space-m);
        padding: var(--space-l);
      }

      .redemption-dialog h2,
      .redemption-dialog p,
      .redemption-dialog ul {
        margin: 0;
      }

      .redemption-dialog h2 {
        font-size: var(--font-size-heading);
        line-height: var(--line-height-ui);
      }

      .redemption-dialog p,
      .redemption-dialog li {
        font-size: var(--font-size-body);
        line-height: var(--line-height-copy);
      }

      .redemption-dialog ul {
        display: grid;
        gap: var(--space-xs);
        padding-inline-start: var(--space-l);
      }

      .redemption-dialog__actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: var(--space-s);
      }

      .redemption-dialog__actions button {
        padding: var(--space-s) var(--space-m);
        border: 1px solid var(--line-muted);
        border-radius: 0;
        background: transparent;
        color: var(--label);
        font: inherit;
        font-size: var(--font-size-label);
        font-weight: 700;
        cursor: pointer;
      }

      .redemption-dialog__actions button:hover,
      .redemption-dialog__actions button:focus-visible {
        border-color: var(--label-muted);
        background: var(--line-muted);
      }

      .redemption-dialog__actions [data-redemption-subtract] {
        border-color: var(--document-border);
        color: var(--document-border);
      }

      .document-strip {
        display: grid;
        align-content: center;
        justify-items: center;
        gap: var(--space-s);
        padding: var(--space-s) var(--space-m);
        overflow: visible;
        border-block-start: 1px solid var(--line-muted);
        background: color-mix(in srgb, var(--surface-alt) 82%, transparent);
      }

      .document-strip__notice {
        inline-size: 100%;
        margin: 0;
        color: var(--label-muted);
        font-size: var(--font-size-caption);
        line-height: var(--line-height-ui);
        text-align: center;
      }

      .document-strip__images {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-m);
      }

      .document-strip__item {
        position: relative;
        display: grid;
        flex: 0 0 var(--document-strip-image-size);
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto auto auto;
        gap: var(--space-xs);
        inline-size: var(--document-strip-image-size);
        min-inline-size: 0;
        max-inline-size: var(--document-strip-image-size);
        margin: 0;
      }

      .document-strip__title {
        display: grid;
        place-items: center;
        min-block-size: calc(var(--font-size-label) * var(--line-height-ui));
        color: var(--label);
        font-size: var(--font-size-label);
        font-weight: 700;
        line-height: var(--line-height-ui);
        letter-spacing: 0;
        white-space: nowrap;
      }

      .document-strip__image-frame {
        aspect-ratio: 1;
        overflow: hidden;
        border: 1px solid var(--document-border);
        background: color-mix(in srgb, var(--season-accent) 10%, var(--surface));
      }

      .document-strip__item--classified .document-strip__image-frame {
        border-color: var(--classified-frame);
        background: color-mix(in srgb, var(--classified-frame) 18%, var(--surface));
      }

      .document-strip__image-frame img {
        display: block;
        inline-size: 100%;
        block-size: 100%;
        object-fit: cover;
      }

      .document-strip__item:hover .document-strip__image-frame,
      .document-strip__item:focus-within .document-strip__image-frame {
        border-color: color-mix(in srgb, var(--document-border) 55%, var(--label));
      }

      .document-strip__item--classified:hover .document-strip__image-frame,
      .document-strip__item--classified:focus-within .document-strip__image-frame {
        border-color: color-mix(in srgb, var(--classified-frame) 60%, var(--label));
      }

      .document-strip__quantity {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 0;
        inline-size: 100%;
        border: 1px solid var(--line-muted);
        background: var(--surface-alt);
      }

      .document-strip__quantity button,
      .document-strip__quantity input {
        min-inline-size: 0;
        block-size: 24px;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: var(--label);
        font: inherit;
        font-size: var(--font-size-label);
        font-variant-numeric: tabular-nums;
        line-height: 1;
        text-align: center;
      }

      .document-strip__quantity button {
        inline-size: 24px;
        cursor: pointer;
      }

      .document-strip__quantity button:hover {
        border-color: var(--label-muted);
        background: var(--line-muted);
      }

      .document-strip__quantity button:focus-visible,
      .document-strip__quantity input:focus-visible {
        outline: 2px solid var(--label);
        outline-offset: 2px;
      }

      .document-strip__quantity input {
        inline-size: 100%;
        border-inline: 1px solid var(--line-muted);
        appearance: textfield;
      }

      .document-strip__quantity input::-webkit-inner-spin-button,
      .document-strip__quantity input::-webkit-outer-spin-button {
        margin: 0;
        appearance: none;
      }

      .document-strip__tooltip {
        position: absolute;
        z-index: 10;
        inset-block-end: calc(100% + var(--space-s));
        inset-inline-start: 50%;
        inline-size: clamp(220px, 18vw, 300px);
        padding: var(--space-s);
        border: 1px solid var(--tooltip-line);
        background: var(--tooltip-surface);
        color: var(--label-muted);
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, var(--space-xs));
        transition:
          opacity 120ms ease-out,
          transform 120ms ease-out;
      }

      .document-strip__tooltip strong {
        display: block;
        margin-block-end: var(--space-xs);
        color: var(--label);
        font-size: var(--font-size-label);
        line-height: var(--line-height-ui);
      }

      .document-strip__tooltip p {
        margin: 0;
        font-size: var(--font-size-label);
        line-height: var(--line-height-body);
      }

      .document-strip__tooltip ul {
        margin: var(--space-s) 0 0;
        padding-block-start: var(--space-s);
        padding-inline-start: var(--space-m);
        border-block-start: 1px solid var(--line-muted);
        font-size: var(--font-size-label);
        line-height: var(--line-height-ui);
      }

      .document-strip__tooltip li + li {

    <script type="module">
      import SlimSelect from 'slim-select';
      import 'slim-select/styles';
      import { CircleHelp, X, createElement as createIconElement } from 'lucide';
      import flagIconUrls from 'virtual:locale-flags';
      import { loadCatalogs } from './src/catalogs.ts';
      import { createLocalizer, formatAccessibleRequirements, formatCountdownUnit, formatLocalPrice, formatNumber, getCompleteLocales, getLocaleRegion } from './src/localization.ts';
      import { browserCookieAdapter, resetPersistedState, restoreState, saveState } from './src/persistence.ts';
      import { countPageRedeemableRewards, planRewardRedemption } from './src/redeemable.ts';
      import { isBattlePassPageUnlocked } from './src/page-unlocks.ts';
      import { getClassifiedDocumentMinimum, reduceState } from './src/state.ts';

      const initialize = async () => {
      const catalogs = await loadCatalogs();
      let state = restoreState(browserCookieAdapter, catalogs, navigator.languages);
      const localizer = createLocalizer(catalogs.localization, state.locale);
      document.documentElement.lang = localizer.locale;
      document.documentElement.dir = localizer.direction;
      const name = document.querySelector('[data-season-name]');
      const timer = document.querySelector('[data-season-timer]');
      const modeSelect = document.querySelector('[data-mode-select]');
      const resetCookieState = document.querySelector('[data-reset-cookie-state]');
      const languageSelect = document.querySelector('[data-language-select]');
      const buyoutLink = document.querySelector('[data-buyout-link]');
      const focusStage = document.querySelector('.focus-stage');
      const focusEyebrow = document.querySelector('[data-focus-eyebrow]');
      const focusHeading = document.querySelector('[data-focus-heading]');
      const focusContent = document.querySelector('[data-focus-content]');
      const viewRouteScheduleButton = document.querySelector('[data-view-route-schedule]');
      const commitRaidButton = document.querySelector('[data-commit-raid]');
      const routeScheduleDialog = document.querySelector('[data-route-schedule-dialog]');
      const routeScheduleTitle = document.querySelector('#route-schedule-title');
      const routeScheduleEstimate = document.querySelector('[data-route-schedule-estimate]');
      const routeScheduleContent = document.querySelector('[data-route-schedule-content]');
      const closeRouteScheduleButton = document.querySelector('[data-close-route-schedule]');
      const buyoutDialog = document.querySelector('[data-buyout-dialog]');
      const buyoutTitle = document.querySelector('#buyout-title');
      const buyoutContent = document.querySelector('[data-buyout-content]');
      const closeBuyoutButton = document.querySelector('[data-close-buyout]');
      const endsAt = catalogs.battlePass.endsAt;
      const rewards = catalogs.battlePass.pages.flatMap((page) => page.rewards);
      const rewardPageById = new Map(catalogs.battlePass.pages.flatMap((page) =>
        page.rewards.map((reward) => [reward.id, page.page])));
      const rewardOrderById = new Map(catalogs.battlePass.pages.flatMap((page) =>
        page.rewards.map((reward, rewardIndex) => [reward.id, rewardIndex])));
      const documentTotal = rewards.reduce(
        (total, reward) => total + reward.requirements.reduce((rewardTotal, requirement) => rewardTotal + requirement.quantity, 0),
        0,
      );
      const rewardTotal = rewards.length;
      const getClaimedDocumentQuantities = () => {
        const claimedRewards = new Set(state.claimedRewardIds);
        const quantities = {};
        rewards.forEach((reward) => {
          if (!claimedRewards.has(reward.id)) return;
          reward.requirements.forEach(({ documentId, quantity }) => {
            quantities[documentId] = (quantities[documentId] ?? 0) + quantity;
          });
        });
        return quantities;
      };

      name.textContent = localizer.text(catalogs.battlePass.id);
      timer.dateTime = new Date(endsAt * 1000).toISOString();
      const createUiIcon = (icon, className) => createIconElement(icon, {
        'aria-hidden': 'true',
        class: [className],
        focusable: 'false',
        'stroke-width': 2,
      });
      document.querySelector('[data-season-help-trigger]').replaceChildren(createUiIcon(CircleHelp, 'season-help__icon'));
      [closeRouteScheduleButton, closeBuyoutButton].forEach((button) => {
        button.replaceChildren(createUiIcon(X, 'dialog-close__icon'));
        button.setAttribute('aria-label', localizer.text('ui.close'));
        button.title = localizer.text('ui.close');
      });
      document.querySelector('[data-season-help-trigger]').setAttribute('aria-label', localizer.text('ui.optimizerHelpLabel'));
      document.querySelector('[data-season-help-tooltip]').textContent = localizer.text('ui.optimizerHelp');
      document.querySelector('[data-document-counter-note]').textContent = localizer.text('ui.documentCounterDisclaimer');
      document.querySelector('[data-asset-disclaimer]').textContent = localizer.text('footer.disclaimer');
      resetCookieState.textContent = localizer.text('ui.resetCookieStorage');
      resetCookieState.addEventListener('click', () => {
        const resetState = resetPersistedState(
          browserCookieAdapter,
          catalogs,
          window.confirm(localizer.text('ui.resetConfirm')),
        );
        if (resetState) window.location.reload();
      });

      const configureProgress = ({ labelId, labelSelector, currentSelector, totalSelector, progressSelector, total }) => {
        const label = localizer.text(labelId);
        const progress = document.querySelector(progressSelector);
        const current = document.querySelector(currentSelector);
        document.querySelector(labelSelector).textContent = label;
        document.querySelector(totalSelector).textContent = formatNumber(total, localizer.locale);
        progress.max = total;
        progress.setAttribute('aria-label', label);
        return (value) => {
          const boundedValue = Math.min(total, Math.max(0, value));
          current.textContent = formatNumber(boundedValue, localizer.locale);
          progress.value = boundedValue;
        };
      };

      const updateDocumentProgress = configureProgress({
        labelId: 'battlePass.documents',
        labelSelector: '[data-document-progress-label]',
        currentSelector: '[data-document-progress-current]',
        totalSelector: '[data-document-progress-total]',
        progressSelector: '[data-document-progress]',
        total: documentTotal,
      });
      const updateRewardProgress = configureProgress({
        labelId: 'battlePass.rewards',
        labelSelector: '[data-reward-progress-label]',
        currentSelector: '[data-reward-progress-current]',
        totalSelector: '[data-reward-progress-total]',
        progressSelector: '[data-reward-progress]',
        total: rewardTotal,
      });

      const refreshProgress = () => {
        const claimedDocumentTotal = Object.values(getClaimedDocumentQuantities())
          .reduce((total, quantity) => total + quantity, 0);
        const ownedDocumentTotal = catalogs.documents.documents.reduce((total, documentRecord) => {
          const quantity = documentRecord.kind === 'classified'
            ? state.classifiedDocuments
            : state.ownedDocuments[documentRecord.id] ?? 0;

          estimate.bundleCounts.forEach((count, index) => {
            if (count === 0) return;
            const bundle = catalogs.optimizerRules.classifiedDocuments.bundles[index];
            appendRow(body, [
              localizer.text('ui.classifiedBundleSize', {
                documents: formatNumber(bundle.classifiedDocuments, localizer.locale),
              }),
              formatNumber(count, localizer.locale),
              formatNumber(bundle.tarCoins * count, localizer.locale),
            ]);
          });
          if (body.childElementCount === 0) appendEmptyRow(body, localizer.text('ui.noBundlesRequired'));
          appendRow(foot, [localizer.text('ui.tarCoinsToSpend'), '', formatNumber(estimate.grossTarCoinsSpent, localizer.locale)]);
          return table;
        };

        const createScenario = (scenario, headingId, localEstimate, battlePassTarCoinsUsed) => {
          const section = createElement('section', 'buyout-section buyout-scenario');
          section.dataset.buyoutScenario = scenario;
          section.append(
            createElement('h3', '', localizer.text(headingId)),
            createTarCoinTable(localEstimate, battlePassTarCoinsUsed),
            createClassifiedTable(),
          );
          return section;
        };

        const battlePassTarCoinsUsed = estimate.startingTarCoinsUsed + estimate.earnedTarCoinsUsed;
        buyoutContent.append(
          createScenario('spend', 'ui.buyoutSpendBattlePassTarCoins', estimate.localEstimate, battlePassTarCoinsUsed),
          createScenario('keep', 'ui.buyoutKeepBattlePassTarCoins', estimate.keepBattlePassTarCoinsLocalEstimate, 0),
        );
      };

      const refreshBuyoutLink = (result) => {
        currentOptimizerResult = result;
        buyoutLink.disabled = false;
        if (result.goal !== 'all-unclaimed-rewards') {
          buyoutLink.hidden = true;
          return;
        }
        const estimate = result.buyout.localEstimate;
        const label = estimate
          ? localizer.text('ui.approximateBuyoutPrice', {
              price: estimate.price > 0
                ? formatLocalPrice({ price: estimate.price, currency: estimate.currency }, localizer.locale)
                : localizer.text('ui.zeroLocalPrice'),
            })
          : localizer.text('ui.buyoutLink');
        buyoutLink.hidden = false;
        buyoutLink.textContent = label;
        buyoutLink.title = localizer.text('ui.buyout');
        buyoutLink.setAttribute('aria-label', localizer.text('ui.openBuyoutEstimate', { price: label }));
      };

      const renderRaidDocuments = (nextRaid) => {
        const instruction = createElement('p', 'focus-instruction');
        const commitMarker = '\uFFFC';
        const instructionText = localizer.text('ui.enterRaidResult', { commit: commitMarker });
        const markerIndex = instructionText.indexOf(commitMarker);
        const inlineCommitButton = createElement(
          'button',
          'focus-instruction__commit',
          localizer.text('ui.commitRaidResult').toLocaleLowerCase(localizer.locale),
        );
        inlineCommitButton.type = 'button';
        inlineCommitButton.dataset.commitRaidInline = '';
        inlineCommitButton.addEventListener('click', () => commitRaidButton.click());
        instruction.append(
          instructionText.slice(0, markerIndex),
          inlineCommitButton,
          instructionText.slice(markerIndex + commitMarker.length),
        );
        const documentGrid = createElement('div', 'focus-documents');
        nextRaid.documents.forEach((recommendation) => {
          const documentRecord = documentsById.get(recommendation.documentId);
          if (!documentRecord) return;
          const isOptional = recommendation.role === 'optional';
          const figure = createElement('figure', `focus-document${isOptional ? ' focus-document--optional' : ''}`);
          figure.dataset.focusDocument = recommendation.documentId;
          figure.dataset.documentRole = recommendation.role;
          const statusId = recommendation.role === 'priority'
            ? 'ui.priorityDocument'
            : recommendation.role === 'stockpile' ? 'ui.stockpileDocument' : 'ui.optionalDocument';
          const status = createElement('span', 'focus-document__status', localizer.text(statusId));
          const imageFrame = createElement('div', 'focus-document__image-frame');
          const image = document.createElement('img');
          image.src = documentAssetUrl(documentRecord.imagePath);
          image.alt = localizer.text(documentRecord.imageAltId);
          image.width = 1254;
          image.height = 1254;
          imageFrame.append(image);
          const caption = document.createElement('figcaption');
          caption.append(createElement('strong', '', documentAbbreviations[documentRecord.id]));
          const stepper = createElement('div', 'raid-result-stepper');
          const decrement = createElement('button', '', '−');
          const input = document.createElement('input');
          const increment = createElement('button', '', '+');
          decrement.type = 'button';
          increment.type = 'button';
          input.type = 'number';
          input.min = '0';
          input.step = '1';
          input.value = '0';
          input.dataset.raidResult = recommendation.documentId;
          input.setAttribute('aria-label', `${localizer.text('ui.raidResult')}: ${localizer.text(documentRecord.id)}`);
          decrement.setAttribute('aria-label', `${localizer.text('ui.raidResult')} − ${localizer.text(documentRecord.id)}`);
          increment.setAttribute('aria-label', `${localizer.text('ui.raidResult')} + ${localizer.text(documentRecord.id)}`);
          const updateDraft = (quantity) => {
            input.value = String(Math.max(0, Math.trunc(quantity)));
            input.setCustomValidity('');
          };
          decrement.addEventListener('click', () => updateDraft(Number(input.value) - 1));
          increment.addEventListener('click', () => updateDraft(Number(input.value) + 1));
          input.addEventListener('input', () => input.setCustomValidity(''));
          input.addEventListener('change', () => {
            const quantity = Number(input.value);
            if (Number.isInteger(quantity) && quantity >= 0) updateDraft(quantity);
          });
          stepper.append(decrement, input, increment);
          figure.append(status, imageFrame, caption, stepper);
          documentGrid.append(figure);
        });
        focusContent.replaceChildren(instruction, documentGrid);
      };

      const renderRouteDetails = (profile, result) => {
        currentNextRaid = profile.nextRaid;
        currentProfile = profile;
        currentOptimizerResult = result;
        refreshBuyoutLink(result);
        viewRouteScheduleButton.textContent = localizer.text('ui.viewFullSchedule');
        viewRouteScheduleButton.disabled = !(
          profile.schedule.length > 0
          || profile.projectedImmediateRewardIds.length > 0
          || profile.exchanges.length > 0
          || profile.purchases.classifiedDocumentsPurchased > 0
        );
        commitRaidButton.textContent = localizer.text('ui.commitRaidResult');
        commitRaidButton.disabled = true;

        if (!profile.route.available) {
          focusEyebrow.textContent = localizer.text('ui.nextRaid');
          focusHeading.textContent = localizer.text('optimizer.noRoute');
          focusContent.replaceChildren(createElement('p', 'focus-message', localizer.text('optimizer.noRoute')));
          return;
        }

        if (!profile.nextRaid) {
          focusEyebrow.textContent = localizer.text('ui.nextRaid');
          focusHeading.textContent = localizer.text('ui.readyNow');
          focusContent.replaceChildren(createElement('p', 'focus-message', localizer.text('ui.noFarmingNeeded')));
          return;
        }

        const nextRaid = profile.nextRaid;
        focusEyebrow.textContent = localizer.text(nextRaid.purpose === 'crate-stockpile'
          ? 'ui.crateStockpileRaid'
          : 'ui.nextRaid');
        focusHeading.textContent = localizer.text('ui.raidLocationSummary', {
          location: localizer.text(nextRaid.locationId),
          difficulty: localizer.text(nextRaid.difficultyId),
          minutes: formatNumber(nextRaid.maxRaidTimeMin, localizer.locale),
        });
        renderRaidDocuments(nextRaid);
        commitRaidButton.disabled = false;
      };

      const showOptimizerLoading = () => {
        optimizerPending = true;
        focusStage.classList.add('focus-stage--loading');
        focusStage.setAttribute('aria-busy', 'true');
        viewRouteScheduleButton.disabled = true;
        commitRaidButton.disabled = true;
        buyoutLink.disabled = true;
        if (currentOptimizerResult) return;
        focusEyebrow.textContent = localizer.text('ui.nextRaid');
        focusHeading.textContent = localizer.text('ui.nextRaid');
        focusContent.replaceChildren(createElement('p', 'focus-loading', '…'));
        viewRouteScheduleButton.textContent = localizer.text('ui.viewFullSchedule');
        commitRaidButton.textContent = localizer.text('ui.commitRaidResult');
        buyoutLink.hidden = true;
      };

      const hideOptimizerLoading = () => {
        optimizerPending = false;
        focusStage.classList.remove('focus-stage--loading');
        focusStage.setAttribute('aria-busy', 'false');
      };

      refreshOptimization = () => {
        const requestId = ++optimizerRequestId;
        showOptimizerLoading();
        optimizerWorker.postMessage({
          requestId,
          input: {
            catalogs,
            claimedRewardIds: state.claimedRewardIds,
            ownedDocuments: state.ownedDocuments,
            classifiedDocuments: state.classifiedDocuments,
            tarCoins: state.tarCoins,
            spendTarCoinsOnClassifiedDocuments: state.spendTarCoinsOnClassifiedDocuments,
            mode: state.mode,
            locale: state.locale,
            crateCount: state.crateCount,
          },
        });
      };

      optimizerWorker.addEventListener('message', ({ data }) => {
        if (data.requestId !== optimizerRequestId) return;
        if (data.error) {
          currentNextRaid = undefined;
          currentProfile = undefined;
          currentOptimizerResult = undefined;
          focusEyebrow.textContent = localizer.text('ui.nextRaid');
          focusHeading.textContent = localizer.text('optimizer.noRoute');
          focusContent.replaceChildren(createElement('p', 'focus-message', data.error));
          viewRouteScheduleButton.disabled = true;
          commitRaidButton.disabled = true;
          buyoutLink.hidden = true;
          hideOptimizerLoading();
          return;
        }
        const result = data.result;
        const profile = result.profiles[result.goal === 'black-division-crates' ? 'fastest' : state.selectedProfile];
        renderRouteDetails(profile, result);
        hideOptimizerLoading();
      });

      commitRaidButton.addEventListener('click', () => {
        if (!currentNextRaid) return;
        const inputs = [...focusContent.querySelectorAll('[data-raid-result]')];
        const updates = [];
        for (const input of inputs) {
          const quantity = Number(input.value);
          if (!Number.isInteger(quantity) || quantity < 0) {
            input.setCustomValidity(localizer.text('ui.invalidQuantity'));
            input.reportValidity();
            return;
          }
          updates.push({ documentId: input.dataset.raidResult, quantity });
        }
        let nextState = state;
        updates.forEach(({ documentId, quantity }) => {
          nextState = reduceState(nextState, {
            type: 'set-owned-document',
            documentId,
            quantity: (nextState.ownedDocuments[documentId] ?? 0) + quantity,
          }, catalogs);
        });
        state = nextState;
        try {
          saveState(state, browserCookieAdapter, catalogs);
        } catch (error) {
          console.error(error);
        }
        refreshProgress();
        refreshRewardRail();
        refreshDocumentQuantities();
        refreshOptimization();
      });

      viewRouteScheduleButton.addEventListener('click', () => {
        if (!currentProfile) return;
        renderScheduleProjection(currentProfile);
        routeScheduleDialog.showModal();
      });

      buyoutLink.addEventListener('click', () => {
        if (!currentOptimizerResult || currentOptimizerResult.goal !== 'all-unclaimed-rewards') return;
        renderBuyout(currentOptimizerResult);
        buyoutDialog.showModal();
      });

      closeRouteScheduleButton.addEventListener('click', () => routeScheduleDialog.close());
      routeScheduleDialog.addEventListener('click', (event) => {
        if (event.target === routeScheduleDialog) routeScheduleDialog.close();
      });
      closeBuyoutButton.addEventListener('click', () => buyoutDialog.close());
      buyoutDialog.addEventListener('click', (event) => {
        if (event.target === buyoutDialog) buyoutDialog.close();
      });

      const modeData = [
        ['pvp-seasonal', 'mode.pvpSeasonal'],
        ['pvp', 'mode.pvp'],
        ['pve', 'mode.pve'],
      ].map(([mode, labelId]) => {
        const limit = formatNumber(catalogs.optimizerRules.dailyDocumentLimits[mode], localizer.locale);
        return {
          text: `${localizer.text(labelId)} · ${limit} / ${localizer.text('ui.day')}`,
          value: mode,
          selected: mode === state.mode,
        };
      });

      new SlimSelect({
        select: modeSelect,
        data: modeData,
        settings: {
          ariaLabel: localizer.text('optimizer.mode'),
          modal: 'off',
          showSearch: false,
        },
        events: {
          afterChange: (selection) => {
            const mode = selection[0]?.value;
            if (mode && mode !== state.mode) dispatch({ type: 'set-mode', mode });
          },
        },
      });

      const regionNames = new Intl.DisplayNames([localizer.locale], { type: 'region' });
      const localeData = getCompleteLocales(catalogs.localization).map((locale) => {
        const region = getLocaleRegion(locale);
        const localeName = region
          ? regionNames.of(region.toUpperCase()) ?? locale
          : locale;
        const localeChoice = document.createElement('span');
        localeChoice.className = 'locale-choice';
        const flagRegion = region ?? 'xx';
        const localeFlag = document.createElement('img');
        localeFlag.className = 'locale-choice__flag';
        localeFlag.src = flagIconUrls[flagRegion];
        localeFlag.alt = '';
        localeFlag.width = 18;
        localeFlag.height = 13;
        localeFlag.dataset.flagRegion = flagRegion;
        const accessibleName = document.createElement('span');
        accessibleName.className = 'locale-choice__name';
        accessibleName.textContent = localeName;
        localeChoice.append(localeFlag, accessibleName);
        return {
          text: localeName,
          value: locale,
          html: localeChoice.outerHTML,
          selected: locale === state.locale,
        };
      });

      new SlimSelect({
        select: languageSelect,
        data: localeData,
        settings: {
          ariaLabel: localizer.text('ui.locale'),
          modal: 'off',
          showSearch: false,
        },
        events: {
          afterChange: (selection) => {
            const locale = selection[0]?.value;
            if (!locale || locale === state.locale) return;
            state = reduceState(state, { type: 'set-locale', locale }, catalogs);
            saveState(state, browserCookieAdapter, catalogs);
            window.location.reload();
          },
        },
      });

      refreshOptimization();

      const updateTimer = () => {
        const totalSeconds = Math.max(0, Math.ceil(endsAt - Date.now() / 1000));
        if (totalSeconds === 0) {
          timer.textContent = localizer.text('season.ended');
          return false;
        }

        const days = Math.floor(totalSeconds / 86400);
        const hours = Math.floor((totalSeconds % 86400) / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const compact = `${days}d ${hours}h ${minutes}m`;
        const accessible = [
          formatCountdownUnit(days, localizer.locale, 'day'),
          formatCountdownUnit(hours, localizer.locale, 'hour'),
          formatCountdownUnit(minutes, localizer.locale, 'minute'),
        ].join(', ');
        timer.textContent = compact;
        timer.setAttribute('aria-label', localizer.text('season.countdown', { time: accessible }));
        return true;
      };

      if (updateTimer()) {
        const timerId = window.setInterval(() => {
          if (!updateTimer()) window.clearInterval(timerId);
        }, 1000);
      }
      };

      const appShell = document.querySelector('.wireframe-shell');
      void initialize()
        .catch((error) => console.error(error))
        .finally(() => appShell.removeAttribute('data-app-pending'));
    </script>
  </body>
</html>
