      </main>
      <footer class="wireframe-footer">
        <p class="wireframe-footer__disclaimer" data-asset-disclaimer></p>
        <span class="wireframe-footer__separator" aria-hidden="true"></span>
        <button class="wireframe-footer__reset" type="button" data-reset-cookie-state></button>
      </footer>
    </div>
    <dialog class="route-schedule-dialog" data-route-schedule-dialog aria-labelledby="route-schedule-title">
      <header>
        <div>
          <h2 id="route-schedule-title"></h2>
          <strong data-route-schedule-estimate></strong>
        </div>
        <button type="button" data-close-route-schedule></button>
      </header>
      <div data-route-schedule-content></div>
    </dialog>
    <dialog class="buyout-dialog" data-buyout-dialog aria-labelledby="buyout-title">
      <header>
        <h2 id="buyout-title"></h2>
        <button type="button" data-close-buyout></button>
      </header>
      <div data-buyout-content></div>
    </dialog>
    <script type="module">
      import SlimSelect from 'slim-select';
      import 'slim-select/styles';
      import englishFlagUrl from 'flag-icons/flags/4x3/gb.svg?no-inline';
      import { loadCatalogs } from './src/catalogs.ts';
      import { createLocalizer, formatAccessibleRequirements, formatCountdownUnit, formatNumber } from './src/localization.ts';
      import { browserCookieAdapter, resetPersistedState, restoreState, saveState } from './src/persistence.ts';
      import { countPageRedeemableRewards, planRewardRedemption } from './src/redeemable.ts';
      import { getClassifiedDocumentMinimum, reduceState } from './src/state.ts';

      const catalogs = await loadCatalogs();
      let state = restoreState(browserCookieAdapter, catalogs);
      const localizer = createLocalizer(catalogs.localization);
      const name = document.querySelector('[data-season-name]');
      const timer = document.querySelector('[data-season-timer]');
      const modeSelect = document.querySelector('[data-mode-select]');
      const resetCookieState = document.querySelector('[data-reset-cookie-state]');
      const languageSelect = document.querySelector('[data-language-select]');
      const buyoutLink = document.querySelector('[data-buyout-link]');
      const focusEyebrow = document.querySelector('[data-focus-eyebrow]');
      const focusHeading = document.querySelector('[data-focus-heading]');
      const focusContent = document.querySelector('[data-focus-content]');
      const viewRouteScheduleButton = document.querySelector('[data-view-route-schedule]');
      const commitRaidButton = document.querySelector('[data-commit-raid]');
      const routeScheduleDialog = document.querySelector('[data-route-schedule-dialog]');
      const routeScheduleTitle = document.querySelector('#route-schedule-title');
      const routeScheduleEstimate = document.querySelector('[data-route-schedule-estimate]');
      const routeScheduleContent = document.querySelector('[data-route-schedule-content]');
      const closeRouteScheduleButton = document.querySelector('[data-close-route-schedule]');
      const buyoutDialog = document.querySelector('[data-buyout-dialog]');
      const buyoutTitle = document.querySelector('#buyout-title');
      const buyoutContent = document.querySelector('[data-buyout-content]');
      const closeBuyoutButton = document.querySelector('[data-close-buyout]');
      const endsAt = catalogs.battlePass.endsAt;
      const rewards = catalogs.battlePass.pages.flatMap((page) => page.rewards);
      const documentTotal = rewards.reduce(
        (total, reward) => total + reward.requirements.reduce((rewardTotal, requirement) => rewardTotal + requirement.quantity, 0),
        0,
      );
      const rewardTotal = rewards.length;
      const getClaimedDocumentQuantities = () => {
        const claimedRewards = new Set(state.claimedRewardIds);
        const quantities = {};
        rewards.forEach((reward) => {
          if (!claimedRewards.has(reward.id)) return;
          reward.requirements.forEach(({ documentId, quantity }) => {
            quantities[documentId] = (quantities[documentId] ?? 0) + quantity;
          });
        });
        return quantities;
      };

      name.textContent = localizer.text(catalogs.battlePass.id);
      timer.dateTime = new Date(endsAt * 1000).toISOString();
      document.querySelector('[data-asset-disclaimer]').textContent = localizer.text('footer.disclaimer');
      resetCookieState.textContent = localizer.text('ui.resetCookieStorage');
      resetCookieState.addEventListener('click', () => {
        const resetState = resetPersistedState(
          browserCookieAdapter,
          catalogs,
          window.confirm(localizer.text('ui.resetConfirm')),
        );
        if (resetState) window.location.reload();
      });

      const configureProgress = ({ labelId, labelSelector, currentSelector, totalSelector, progressSelector, total }) => {
        const label = localizer.text(labelId);
        const progress = document.querySelector(progressSelector);
        const current = document.querySelector(currentSelector);
        document.querySelector(labelSelector).textContent = label;
        document.querySelector(totalSelector).textContent = formatNumber(total, localizer.locale);
        progress.max = total;
        progress.setAttribute('aria-label', label);
        return (value) => {
          const boundedValue = Math.min(total, Math.max(0, value));
          current.textContent = formatNumber(boundedValue, localizer.locale);
          progress.value = boundedValue;
        };
      };

      const updateDocumentProgress = configureProgress({
        labelId: 'battlePass.documents',
        labelSelector: '[data-document-progress-label]',
        currentSelector: '[data-document-progress-current]',
        totalSelector: '[data-document-progress-total]',
        progressSelector: '[data-document-progress]',
        total: documentTotal,
      });
      const updateRewardProgress = configureProgress({
        labelId: 'battlePass.rewards',
        labelSelector: '[data-reward-progress-label]',
        currentSelector: '[data-reward-progress-current]',
        totalSelector: '[data-reward-progress-total]',
        progressSelector: '[data-reward-progress]',
        total: rewardTotal,
      });

      const refreshProgress = () => {
        const claimedDocumentTotal = Object.values(getClaimedDocumentQuantities())
          .reduce((total, quantity) => total + quantity, 0);
        const ownedDocumentTotal = catalogs.documents.documents.reduce((total, documentRecord) => {
          const quantity = documentRecord.kind === 'classified'
            ? state.classifiedDocuments
            : state.ownedDocuments[documentRecord.id] ?? 0;
          return total + quantity;
        }, 0);
        updateDocumentProgress(claimedDocumentTotal + ownedDocumentTotal);
        updateRewardProgress(state.claimedRewardIds.length);
      };

      let refreshRewardRail = () => {};
      let refreshDocumentQuantities = () => {};
      let refreshOptimization = () => {};
      const dispatch = (action) => {
        state = reduceState(state, action, catalogs);
        try {
          saveState(state, browserCookieAdapter);
        } catch (error) {
          console.error(error);
        }
        refreshProgress();
        refreshRewardRail();
        refreshDocumentQuantities();
        refreshOptimization();
      };

      refreshProgress();

      document.querySelector('[data-route-profile-label]').textContent = localizer.text('ui.routePreference');
      document.querySelector('[data-fastest-label]').textContent = localizer.text('optimizer.fastest');
      document.querySelector('[data-safest-label]').textContent = localizer.text('optimizer.safest');
      document.querySelectorAll('input[name="route-profile"]').forEach((input) => {
        input.checked = input.value === state.selectedProfile;
        input.addEventListener('change', () => {
          if (input.checked) dispatch({ type: 'set-profile', profile: input.value });
        });
      });

      const rewardHeading = document.querySelector('[data-reward-heading]');
      const claimAllButton = document.querySelector('[data-reward-claim-all]');
      const clearAllButton = document.querySelector('[data-reward-clear-all]');
      const rewardPages = document.querySelector('[data-reward-pages]');
      const documentNames = Object.fromEntries(catalogs.documents.documents.map((documentRecord) => [documentRecord.id, localizer.text(documentRecord.id)]));
      const documentAbbreviations = Object.fromEntries(Object.entries(documentNames).map(([documentId, documentName]) => [documentId, documentName.trim().split(/\s+/u)[0]]));
      const redemptionDialog = document.createElement('dialog');
      const redemptionContent = document.createElement('div');
      const redemptionTitle = document.createElement('h2');
      const redemptionMessage = document.createElement('p');
      const redemptionDocuments = document.createElement('ul');
      const redemptionActions = document.createElement('div');
      const subtractDocumentsButton = document.createElement('button');
      const redeemOnlyButton = document.createElement('button');
      const cancelRedemptionButton = document.createElement('button');
      const redemptionTitleId = 'reward-redemption-title';
      let pendingRewardId;

      redemptionDialog.className = 'redemption-dialog';
      redemptionDialog.setAttribute('aria-labelledby', redemptionTitleId);
      redemptionContent.className = 'redemption-dialog__content';
      redemptionTitle.id = redemptionTitleId;
      redemptionActions.className = 'redemption-dialog__actions';
      subtractDocumentsButton.type = 'button';
      subtractDocumentsButton.dataset.redemptionSubtract = '';
      subtractDocumentsButton.textContent = localizer.text('battlePass.redeemAndSubtract');
      redeemOnlyButton.type = 'button';
      redeemOnlyButton.textContent = localizer.text('battlePass.redeemOnly');
      cancelRedemptionButton.type = 'button';
      cancelRedemptionButton.textContent = localizer.text('ui.cancel');
      redemptionActions.append(cancelRedemptionButton, redeemOnlyButton, subtractDocumentsButton);
      redemptionContent.append(redemptionTitle, redemptionMessage, redemptionDocuments, redemptionActions);
      redemptionDialog.append(redemptionContent);
      document.body.append(redemptionDialog);

      const openRedemptionDialog = (reward, plan) => {
        pendingRewardId = reward.id;
        redemptionTitle.textContent = localizer.text('battlePass.redeemRewardTitle', { reward: localizer.text(reward.id) });
        redemptionMessage.textContent = localizer.text('battlePass.subtractDocumentsPrompt');
        redemptionDocuments.replaceChildren();
        Object.entries(plan.regularDocuments).forEach(([documentId, quantity]) => {
          const item = document.createElement('li');
          item.textContent = `${documentNames[documentId]} (${formatNumber(quantity, localizer.locale)})`;
          redemptionDocuments.append(item);
        });
        if (plan.classifiedDocuments > 0) {
          const item = document.createElement('li');
          item.textContent = `${localizer.text('battlePass.classifiedDocuments')} (${formatNumber(plan.classifiedDocuments, localizer.locale)})`;
          redemptionDocuments.append(item);
        }
        redemptionDocuments.hidden = redemptionDocuments.childElementCount === 0;
        redemptionDialog.showModal();
        subtractDocumentsButton.focus({ preventScroll: true });
      };

      const closeRedemptionDialog = () => {
        if (redemptionDialog.open) redemptionDialog.close();
      };

      subtractDocumentsButton.addEventListener('click', () => {
        const rewardId = pendingRewardId;
        closeRedemptionDialog();
        if (rewardId) dispatch({ type: 'redeem-reward', rewardId });
      });
      redeemOnlyButton.addEventListener('click', () => {
        const rewardId = pendingRewardId;
        closeRedemptionDialog();
        if (rewardId) dispatch({ type: 'claim-reward', rewardId, claimed: true });
      });
      cancelRedemptionButton.addEventListener('click', closeRedemptionDialog);
      redemptionDialog.addEventListener('close', () => {
        pendingRewardId = undefined;
        refreshRewardRail();
      });

      const pageViews = catalogs.battlePass.pages.map((page) => {
        const pageSection = document.createElement('section');
        const trigger = document.createElement('button');
        const pageLabel = document.createElement('span');
        const redeemableCount = document.createElement('span');
        const claimedCount = document.createElement('span');
        const chevron = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        const chevronPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        const panel = document.createElement('div');
        const itemList = document.createElement('ul');
        const triggerId = `reward-page-trigger-${page.page}`;
        const panelId = `reward-page-panel-${page.page}`;

        pageSection.className = 'reward-page';
        trigger.className = 'reward-page__trigger';
        trigger.type = 'button';
        trigger.id = triggerId;
        trigger.setAttribute('aria-controls', panelId);
        pageLabel.className = 'reward-page__label';
        pageLabel.textContent = `${localizer.text('battlePass.page')} ${String(page.page).padStart(2, '0')}`;
        redeemableCount.className = 'reward-page__redeemable';
        pageLabel.append(' ', redeemableCount);
        claimedCount.className = 'reward-page__count';
        chevron.classList.add('reward-page__chevron');
        chevron.setAttribute('viewBox', '0 0 12 8');
        chevron.setAttribute('aria-hidden', 'true');
        chevron.setAttribute('focusable', 'false');
        chevronPath.setAttribute('d', 'M1 1.25 6 6.25 11 1.25');
        chevronPath.setAttribute('fill', 'none');
        chevronPath.setAttribute('stroke', 'currentColor');
        chevronPath.setAttribute('stroke-width', '1.5');
        chevronPath.setAttribute('stroke-linecap', 'square');
        chevronPath.setAttribute('stroke-linejoin', 'miter');
        chevron.append(chevronPath);
        panel.className = 'reward-page__panel';
        panel.id = panelId;
        panel.setAttribute('role', 'region');
        panel.setAttribute('aria-labelledby', triggerId);
        itemList.className = 'reward-page__items';

        const rewardInputs = page.rewards.map((reward) => {
          const item = document.createElement('li');
          const label = document.createElement('label');
          const checkbox = document.createElement('input');
          const copy = document.createElement('span');
          const rewardName = document.createElement('span');
          const requirements = document.createElement('span');
          const fullName = localizer.text(reward.id);

          item.className = 'reward-item';
          checkbox.type = 'checkbox';
          checkbox.dataset.rewardId = reward.id;
          checkbox.setAttribute('aria-label', `${localizer.text('battlePass.claimReward')}: ${fullName}`);
          copy.className = 'reward-item__copy';
          rewardName.className = 'reward-item__name';
          rewardName.textContent = fullName;
          requirements.className = 'reward-item__requirements';
          requirements.textContent = reward.requirements.map(({ documentId, quantity }) => `${documentAbbreviations[documentId]} (${formatNumber(quantity, localizer.locale)})`).join(' · ');
          requirements.title = formatAccessibleRequirements(reward.requirements, documentNames, localizer.locale);
          copy.append(rewardName, requirements);
          label.append(checkbox, copy);
          item.append(label);
          itemList.append(item);

          checkbox.addEventListener('change', () => {
            if (!checkbox.checked) {
              dispatch({ type: 'claim-reward', rewardId: reward.id, claimed: false });
              return;
            }
            const plan = planRewardRedemption(reward, state.ownedDocuments, state.classifiedDocuments);
            if (!plan.canRedeem) {
              dispatch({ type: 'claim-reward', rewardId: reward.id, claimed: true });
              return;
            }
            checkbox.checked = false;
            openRedemptionDialog(reward, plan);
          });
          return { reward, rewardId: reward.id, checkbox, item };
        });

        trigger.append(pageLabel, claimedCount, chevron);
        trigger.addEventListener('click', () => dispatch({ type: 'set-page', page: page.page }));
        panel.append(itemList);
        pageSection.append(trigger, panel);
        rewardPages.append(pageSection);
        return { page, pageSection, trigger, panel, redeemableCount, claimedCount, rewardInputs };
      });

      const crateReward = document.createElement('article');
      const crateRewardName = document.createElement('strong');
      const crateRewardRequirement = document.createElement('span');
      crateReward.className = 'reward-crate';
      crateRewardName.className = 'reward-item__name';
      crateRewardName.textContent = localizer.text('battlePass.blackDivisionCrate');
      crateRewardRequirement.className = 'reward-item__requirements';
      crateRewardRequirement.textContent = localizer.text('ui.anyRegularDocuments', {
        count: formatNumber(catalogs.optimizerRules.exchange.regularDocumentsPerBlackDivisionGearCrate, localizer.locale),
      });
      crateReward.append(crateRewardName, crateRewardRequirement);

      rewardHeading.textContent = localizer.text('battlePass.rewards');
      claimAllButton.textContent = localizer.text('battlePass.claimAll');
      clearAllButton.textContent = localizer.text('battlePass.clearAll');
      claimAllButton.addEventListener('click', () => dispatch({ type: 'claim-all', claimed: true }));
      clearAllButton.addEventListener('click', () => dispatch({ type: 'claim-all', claimed: false }));

      refreshRewardRail = () => {
        const claimedRewards = new Set(state.claimedRewardIds);
        const allRewardsClaimed = rewards.every((reward) => claimedRewards.has(reward.id));
        rewardPages.replaceChildren(...(allRewardsClaimed ? [crateReward] : pageViews.map(({ pageSection }) => pageSection)));
        claimAllButton.disabled = allRewardsClaimed;
        pageViews.forEach(({ page, pageSection, trigger, panel, redeemableCount, claimedCount, rewardInputs }) => {
          const selected = page.page === state.selectedPage;
          const claimedOnPage = rewardInputs.filter(({ rewardId }) => claimedRewards.has(rewardId)).length;
          const redeemableOnPage = countPageRedeemableRewards({
            page,
            claimedRewardIds: state.claimedRewardIds,
            ownedDocuments: state.ownedDocuments,
            classifiedDocuments: state.classifiedDocuments,
          });
          trigger.setAttribute('aria-expanded', String(selected));
          pageSection.classList.toggle('reward-page--complete', claimedOnPage === rewardInputs.length);
          panel.hidden = !selected;
          redeemableCount.textContent = redeemableOnPage > 0
            ? localizer.text('battlePass.redeemableCount', { count: formatNumber(redeemableOnPage, localizer.locale) })
            : '';
          claimedCount.textContent = `${formatNumber(claimedOnPage, localizer.locale)} / ${formatNumber(page.rewards.length, localizer.locale)}`;
          rewardInputs.forEach(({ reward, rewardId, checkbox, item }) => {
            const claimed = claimedRewards.has(rewardId);
            const redeemable = !claimed && planRewardRedemption(
              reward,
              state.ownedDocuments,
              state.classifiedDocuments,
            ).canRedeem;
            checkbox.checked = claimed;
            item.classList.toggle('reward-item--redeemable', redeemable);
          });
        });
      };
      refreshRewardRail();

      const documentsById = new Map(catalogs.documents.documents.map((document) => [document.id, document]));
      const documentQuantityViews = [];
      document.querySelectorAll('[data-document-id]').forEach((tile, index) => {
        const documentId = tile.dataset.documentId;
        const documentRecord = documentsById.get(documentId);
        if (!documentRecord) throw new Error(`Unknown wireframe document: ${documentId}`);

        const fullName = localizer.text(documentRecord.id);
        const tooltip = tile.querySelector('.document-strip__tooltip');
        const quantityInput = tile.querySelector('[data-document-quantity]');
        const decrementButton = tile.querySelector('[data-document-decrement]');
        const incrementButton = tile.querySelector('[data-document-increment]');
        const tooltipId = `document-strip-tooltip-${index}`;
        tooltip.id = tooltipId;
        tile.querySelector('[data-document-title]').textContent = fullName.trim().split(/\s+/u)[0];
        tile.querySelector('img').alt = localizer.text(documentRecord.imageAltId);
        tile.querySelector('[data-document-tooltip-name]').textContent = fullName;
        tile.querySelector('[data-document-tooltip-description]').textContent = localizer.text(documentRecord.descriptionId);

        if (documentRecord.sourceLocationIds.length > 0) {
          const locationList = document.createElement('ul');
          documentRecord.sourceLocationIds.forEach((locationId) => {
            const location = document.createElement('li');
            location.textContent = localizer.text(locationId);
            locationList.append(location);
          });
          tooltip.append(locationList);
        }

        const quantityLabel = localizer.text('ui.quantity');
        quantityInput.setAttribute('aria-label', `${quantityLabel} ${fullName}`);
        decrementButton.setAttribute('aria-label', `${quantityLabel} − ${fullName}`);
        incrementButton.setAttribute('aria-label', `${quantityLabel} + ${fullName}`);
        [quantityInput, decrementButton, incrementButton].forEach((control) => control.setAttribute('aria-describedby', tooltipId));

        const readQuantity = () => documentRecord.kind === 'classified'
          ? state.classifiedDocuments
          : state.ownedDocuments[documentId] ?? 0;
        const readMinimumQuantity = () => documentRecord.kind === 'classified'
          ? getClassifiedDocumentMinimum(state.claimedRewardIds)
          : 0;
        const setQuantity = (quantity) => {
          const normalizedQuantity = Math.max(readMinimumQuantity(), Math.trunc(quantity));
          dispatch(documentRecord.kind === 'classified'
            ? { type: 'set-classified-documents', quantity: normalizedQuantity }
            : { type: 'set-owned-document', documentId, quantity: normalizedQuantity });
          quantityInput.value = String(readQuantity());
        };
        quantityInput.min = String(readMinimumQuantity());
        quantityInput.value = String(readQuantity());
        decrementButton.addEventListener('click', () => setQuantity(Number(quantityInput.value) - 1));
        incrementButton.addEventListener('click', () => setQuantity(Number(quantityInput.value) + 1));
        quantityInput.addEventListener('change', () => {
          const quantity = Number(quantityInput.value);
          setQuantity(Number.isFinite(quantity) ? quantity : 0);
        });
        documentQuantityViews.push({ quantityInput, readMinimumQuantity, readQuantity });
      });

      refreshDocumentQuantities = () => {
        documentQuantityViews.forEach(({ quantityInput, readMinimumQuantity, readQuantity }) => {
          quantityInput.min = String(readMinimumQuantity());
          quantityInput.value = String(readQuantity());
        });
      };
      refreshDocumentQuantities();

      const optimizerWorker = new Worker(new URL('./src/optimizer-worker.ts', import.meta.url), { type: 'module' });
      let optimizerRequestId = 0;
      let currentNextRaid;
      let currentProfile;
      let currentOptimizerResult;

      const createElement = (tagName, className, textContent) => {
        const element = document.createElement(tagName);
        if (className) element.className = className;
        if (textContent !== undefined) element.textContent = textContent;
        return element;
      };

      const documentAssetUrl = (imagePath) => `${import.meta.env.BASE_URL}${imagePath.replace(/^\//u, '')}`;

      const renderScheduleProjection = (profile) => {
        routeScheduleTitle.textContent = localizer.text('ui.fullSchedule');
        routeScheduleEstimate.textContent = localizer.text('ui.estimatedDays', {
          count: formatNumber(profile.schedule.length, localizer.locale),
        });
        closeRouteScheduleButton.textContent = localizer.text('ui.close');
        routeScheduleContent.replaceChildren();
        routeScheduleContent.append(createElement('p', 'schedule-estimate-note', localizer.text('ui.planEstimate')));

        if (profile.exchanges.length > 0 || profile.purchases.classifiedDocumentsPurchased > 0) {
          const actions = createElement('section', 'schedule-plan-actions');
          actions.append(createElement('h3', '', localizer.text('ui.planActions')));
          if (profile.exchanges.length > 0) {
            const group = createElement('div', 'schedule-action-group');
            const list = document.createElement('ul');
            group.append(createElement('h4', '', localizer.text('ui.regularExchanges')));
            profile.exchanges.forEach((exchange) => {
              const donors = Object.entries(exchange.donors)
                .map(([documentId, quantity]) => `${localizer.text(documentId)} × ${formatNumber(quantity, localizer.locale)}`)
                .join(' + ');
              list.append(createElement('li', '', localizer.text('ui.exchangeInstruction', {
                donors,
                received: localizer.text(exchange.receivedDocumentId),
              })));
            });
            group.append(list);
            actions.append(group);
          }
          if (profile.purchases.classifiedDocumentsPurchased > 0) {
            const group = createElement('div', 'schedule-action-group');
            const summary = createElement('p', '', localizer.text('ui.purchaseSummary', {
              count: formatNumber(profile.purchases.classifiedDocumentsPurchased, localizer.locale),
              tarCoins: formatNumber(profile.purchases.tarCoinsSpent, localizer.locale),
            }));
            const list = document.createElement('ul');
            group.append(createElement('h4', '', localizer.text('ui.classifiedPurchases')), summary);
            profile.purchases.bundleCounts.forEach((count, index) => {
              if (count === 0) return;
              const bundle = catalogs.optimizerRules.classifiedDocuments.bundles[index];
              list.append(createElement('li', '', localizer.text('ui.classifiedBundleInstruction', {
                documents: formatNumber(bundle.classifiedDocuments, localizer.locale),
                count: formatNumber(count, localizer.locale),
              })));
            });
            group.append(list);
            actions.append(group);
          }
          routeScheduleContent.append(actions);
        }

        if (profile.projectedImmediateRewardIds.length > 0) {
          const immediate = createElement('section', 'schedule-immediate');
          const list = document.createElement('ul');
          immediate.append(createElement('h3', '', localizer.text('ui.rewardsAvailableNow')));
          profile.projectedImmediateRewardIds.forEach((rewardId) => list.append(createElement('li', '', localizer.text(rewardId))));
          immediate.append(list);
          routeScheduleContent.append(immediate);
        }

        profile.schedule.forEach((day) => {
          const daySection = createElement('section', 'schedule-projection-day');
          const columns = createElement('div', 'schedule-projection-day__columns');
          const raids = createElement('section', 'schedule-day-column schedule-day-column--raids');
          const raidList = document.createElement('ul');
          const rewardClaims = createElement('section', 'schedule-day-column schedule-day-column--rewards');
          const rewardList = document.createElement('ul');
          daySection.append(createElement('h3', '', localizer.text('ui.scheduleDay', {
            day: formatNumber(day.day, localizer.locale),
            count: formatNumber(day.documentQuantity, localizer.locale),
          })));
          raids.append(createElement('h4', '', localizer.text('ui.raids')));
          day.locations.forEach((location) => {
            const targets = location.documents
              .map((assignment) => `${localizer.text(assignment.documentId)} × ${formatNumber(assignment.quantity, localizer.locale)}`)
              .join(' · ');
            const item = document.createElement('li');
            item.append(
              createElement('strong', '', localizer.text('ui.raidLocationSummary', {
                location: localizer.text(location.locationId),
                difficulty: localizer.text(location.difficultyId),
                minutes: formatNumber(location.maxRaidTimeMin, localizer.locale),
              })),
              createElement('span', '', targets),
            );
            raidList.append(item);
          });
          raids.append(raidList);
          rewardClaims.append(createElement('h4', '', localizer.text('ui.rewardsToRedeem')));
          day.rewardIdsClaimed.forEach((rewardId) => rewardList.append(createElement('li', '', localizer.text(rewardId))));
          if (rewardList.childElementCount > 0) rewardClaims.append(rewardList);
          else rewardClaims.append(createElement('p', '', localizer.text('ui.noRewardsToRedeem')));
          columns.append(raids, rewardClaims);
          daySection.append(columns);
          routeScheduleContent.append(daySection);
        });
      };

      const renderBuyout = (result) => {
        const estimate = result.buyout;
        const localEstimate = estimate.localEstimate;
        buyoutTitle.textContent = localizer.text('ui.buyout');
        closeBuyoutButton.textContent = localizer.text('ui.close');
        buyoutContent.replaceChildren();

        const funding = createElement('section', 'buyout-section');
        funding.append(
          createElement('h3', '', localizer.text('ui.buyoutFundingHeading')),
          createElement('p', '', localizer.text('ui.buyoutGrossTarCoins', {
            count: formatNumber(estimate.grossTarCoinsSpent, localizer.locale),
          })),
          createElement('p', '', localizer.text('ui.additionalTarCoins', {
            count: formatNumber(estimate.minimumAdditionalTarCoins, localizer.locale),
          })),
          createElement('p', '', localizer.text('ui.buyoutFunding', {
            starting: formatNumber(estimate.startingTarCoinsUsed, localizer.locale),
            earned: formatNumber(estimate.earnedTarCoinsUsed, localizer.locale),
          })),
        );
        if (localEstimate) {
          funding.append(createElement('p', '', localizer.text('ui.fromEstimate', {
            price: localEstimate.costMinor > 0 ? localEstimate.display : localizer.text('ui.zeroLocalPrice'),
          })));
        } else {
          funding.append(createElement('p', '', localizer.text('ui.localPriceUnavailable')));
        }
        buyoutContent.append(funding);

        const classified = createElement('section', 'buyout-section');
        const classifiedList = document.createElement('ul');
        classified.append(
          createElement('h3', '', localizer.text('ui.classifiedBundles')),
          createElement('p', '', localizer.text('ui.buyoutClassified', {
            purchased: formatNumber(estimate.classifiedDocumentsPurchased, localizer.locale),
            excess: formatNumber(estimate.excessClassifiedDocuments, localizer.locale),
          })),
        );
        estimate.bundleCounts.forEach((count, index) => {
          if (count === 0) return;
          const bundle = catalogs.optimizerRules.classifiedDocuments.bundles[index];
          classifiedList.append(createElement('li', '', localizer.text('ui.classifiedBundleInstruction', {
            documents: formatNumber(bundle.classifiedDocuments, localizer.locale),
            count: formatNumber(count, localizer.locale),
          })));
        });
        if (classifiedList.childElementCount > 0) classified.append(classifiedList);
        else classified.append(createElement('p', '', localizer.text('ui.noBundlesRequired')));
        buyoutContent.append(classified);

        const packages = createElement('section', 'buyout-section');
        const packageList = document.createElement('ul');
        packages.append(createElement('h3', '', localizer.text('ui.tarCoinPackages')));
        localEstimate?.packageCounts.forEach((count, index) => {
          if (count === 0) return;
          const bundle = catalogs.optimizerRules.tarCoinBundles[index];
          const price = localizer.price(bundle.localPriceId);
          packageList.append(createElement('li', '', localizer.text('ui.tarCoinPackageInstruction', {
            tarCoins: formatNumber(bundle.tarCoins, localizer.locale),
            count: formatNumber(count, localizer.locale),
            price: price?.display ?? localizer.text('ui.localPriceUnavailable'),
          })));
        });
        if (packageList.childElementCount > 0 && localEstimate) {
          packages.append(
            packageList,
            createElement('p', '', localizer.text('ui.tarCoinPackageSummary', {
              purchased: formatNumber(localEstimate.tarCoinsPurchased, localizer.locale),
              excess: formatNumber(localEstimate.excessTarCoins, localizer.locale),
            })),
          );
        } else if (estimate.minimumAdditionalTarCoins === 0) {
          packages.append(createElement('p', '', localizer.text('ui.noTarCoinPackagesRequired')));
        } else {
          packages.append(createElement('p', '', localizer.text('ui.localPriceUnavailable')));
        }
        buyoutContent.append(packages);
      };

      const refreshBuyoutLink = (result) => {
        currentOptimizerResult = result;
        if (result.goal !== 'all-unclaimed-rewards') {
          buyoutLink.hidden = true;
          return;
        }
        const estimate = result.buyout.localEstimate;
        const label = estimate
          ? localizer.text('ui.approximateBuyoutPrice', {
              price: estimate.costMinor > 0 ? estimate.display : localizer.text('ui.zeroLocalPrice'),
            })
          : localizer.text('ui.buyoutLink');
        buyoutLink.hidden = false;
        buyoutLink.textContent = label;
        buyoutLink.title = localizer.text('ui.buyout');
        buyoutLink.setAttribute('aria-label', localizer.text('ui.openBuyoutEstimate', { price: label }));
      };

      const renderRaidDocuments = (nextRaid) => {
        const instruction = createElement('p', 'focus-instruction', localizer.text('ui.enterRaidResult'));
        const documentGrid = createElement('div', 'focus-documents');
        nextRaid.documents.forEach((recommendation) => {
          const documentRecord = documentsById.get(recommendation.documentId);
          if (!documentRecord) return;
          const isOptional = recommendation.role === 'optional';
          const figure = createElement('figure', `focus-document${isOptional ? ' focus-document--optional' : ''}`);
          figure.dataset.focusDocument = recommendation.documentId;
          figure.dataset.documentRole = recommendation.role;
          const statusId = recommendation.role === 'priority'
            ? 'ui.priorityDocument'
            : recommendation.role === 'stockpile' ? 'ui.stockpileDocument' : 'ui.optionalDocument';
          const status = createElement('span', 'focus-document__status', localizer.text(statusId));
          const imageFrame = createElement('div', 'focus-document__image-frame');
          const image = document.createElement('img');
          image.src = documentAssetUrl(documentRecord.imagePath);
          image.alt = localizer.text(documentRecord.imageAltId);
          imageFrame.append(image);
          const caption = document.createElement('figcaption');
          caption.append(createElement('strong', '', documentAbbreviations[documentRecord.id]));
          const stepper = createElement('div', 'raid-result-stepper');
          const decrement = createElement('button', '', '−');
          const input = document.createElement('input');
          const increment = createElement('button', '', '+');
          decrement.type = 'button';
          increment.type = 'button';
          input.type = 'number';
          input.min = '0';
          input.step = '1';
          input.value = '0';
          input.dataset.raidResult = recommendation.documentId;
          input.setAttribute('aria-label', `${localizer.text('ui.raidResult')}: ${localizer.text(documentRecord.id)}`);
          decrement.setAttribute('aria-label', `${localizer.text('ui.raidResult')} − ${localizer.text(documentRecord.id)}`);
          increment.setAttribute('aria-label', `${localizer.text('ui.raidResult')} + ${localizer.text(documentRecord.id)}`);
          const updateDraft = (quantity) => {
            input.value = String(Math.max(0, Math.trunc(quantity)));
            input.setCustomValidity('');
          };
          decrement.addEventListener('click', () => updateDraft(Number(input.value) - 1));
          increment.addEventListener('click', () => updateDraft(Number(input.value) + 1));
          input.addEventListener('input', () => input.setCustomValidity(''));
          input.addEventListener('change', () => {
            const quantity = Number(input.value);
            if (Number.isInteger(quantity) && quantity >= 0) updateDraft(quantity);
          });
          stepper.append(decrement, input, increment);
          figure.append(status, imageFrame, caption, stepper);
          documentGrid.append(figure);
        });
        focusContent.replaceChildren(instruction, documentGrid);
      };

      const renderRouteDetails = (profile, result) => {
        currentNextRaid = profile.nextRaid;
        currentProfile = profile;
        currentOptimizerResult = result;
        refreshBuyoutLink(result);
        viewRouteScheduleButton.textContent = localizer.text('ui.viewFullSchedule');
        viewRouteScheduleButton.disabled = !(
          profile.schedule.length > 0
          || profile.projectedImmediateRewardIds.length > 0
          || profile.exchanges.length > 0
          || profile.purchases.classifiedDocumentsPurchased > 0
        );
        commitRaidButton.textContent = localizer.text('ui.commitRaidResult');
        commitRaidButton.disabled = true;

        if (!profile.route.available) {
          focusEyebrow.textContent = localizer.text('ui.nextRaid');
          focusHeading.textContent = localizer.text('optimizer.noRoute');
          focusContent.replaceChildren(createElement('p', 'focus-message', localizer.text('optimizer.noRoute')));
          return;
        }

        if (!profile.nextRaid) {
          focusEyebrow.textContent = localizer.text('ui.nextRaid');
          focusHeading.textContent = localizer.text('ui.readyNow');
          focusContent.replaceChildren(createElement('p', 'focus-message', localizer.text('ui.noFarmingNeeded')));
          return;
        }

        const nextRaid = profile.nextRaid;
        focusEyebrow.textContent = localizer.text(nextRaid.purpose === 'crate-stockpile'
          ? 'ui.crateStockpileRaid'
          : 'ui.nextRaid');
        focusHeading.textContent = localizer.text('ui.raidLocationSummary', {
          location: localizer.text(nextRaid.locationId),
          difficulty: localizer.text(nextRaid.difficultyId),
          minutes: formatNumber(nextRaid.maxRaidTimeMin, localizer.locale),
        });
        renderRaidDocuments(nextRaid);
        commitRaidButton.disabled = false;
      };

      const showOptimizerLoading = () => {
        focusEyebrow.textContent = localizer.text('ui.nextRaid');
        focusHeading.textContent = localizer.text('ui.nextRaid');
        focusContent.replaceChildren(createElement('p', 'focus-loading', '…'));
        viewRouteScheduleButton.textContent = localizer.text('ui.viewFullSchedule');
        viewRouteScheduleButton.disabled = true;
        commitRaidButton.textContent = localizer.text('ui.commitRaidResult');
        commitRaidButton.disabled = true;
        buyoutLink.hidden = true;
        currentNextRaid = undefined;
        currentProfile = undefined;
        currentOptimizerResult = undefined;
      };

      refreshOptimization = () => {
        const requestId = ++optimizerRequestId;
        showOptimizerLoading();
        optimizerWorker.postMessage({
          requestId,
          input: {
            catalogs,
            claimedRewardIds: state.claimedRewardIds,
            ownedDocuments: state.ownedDocuments,
            classifiedDocuments: state.classifiedDocuments,
            tarCoins: state.tarCoins,
            spendTarCoinsOnClassifiedDocuments: state.spendTarCoinsOnClassifiedDocuments,
            mode: state.mode,
            locale: state.locale,
            crateCount: state.crateCount,
          },
        });
      };

      optimizerWorker.addEventListener('message', ({ data }) => {
        if (data.requestId !== optimizerRequestId) return;
        if (data.error) {
          focusEyebrow.textContent = localizer.text('ui.nextRaid');
          focusHeading.textContent = localizer.text('optimizer.noRoute');
          focusContent.replaceChildren(createElement('p', 'focus-message', data.error));
          viewRouteScheduleButton.disabled = true;
          commitRaidButton.disabled = true;
          buyoutLink.hidden = true;
          return;
        }
        const result = data.result;
        const profile = result.profiles[result.goal === 'black-division-crates' ? 'fastest' : state.selectedProfile];
        renderRouteDetails(profile, result);
      });

      commitRaidButton.addEventListener('click', () => {
        if (!currentNextRaid) return;
        const inputs = [...focusContent.querySelectorAll('[data-raid-result]')];
        const updates = [];
        for (const input of inputs) {
          const quantity = Number(input.value);
          if (!Number.isInteger(quantity) || quantity < 0) {
            input.setCustomValidity(localizer.text('ui.invalidQuantity'));
            input.reportValidity();
            return;
          }
          updates.push({ documentId: input.dataset.raidResult, quantity });
        }
        let nextState = state;
        updates.forEach(({ documentId, quantity }) => {
          nextState = reduceState(nextState, {
            type: 'set-owned-document',
            documentId,
            quantity: (nextState.ownedDocuments[documentId] ?? 0) + quantity,
          }, catalogs);
        });
        state = nextState;
        try {
          saveState(state, browserCookieAdapter);
        } catch (error) {
          console.error(error);
        }
        refreshProgress();
        refreshRewardRail();
        refreshDocumentQuantities();
        refreshOptimization();
      });

      viewRouteScheduleButton.addEventListener('click', () => {
        if (!currentProfile) return;
        renderScheduleProjection(currentProfile);
        routeScheduleDialog.showModal();
      });

      buyoutLink.addEventListener('click', () => {
        if (!currentOptimizerResult || currentOptimizerResult.goal !== 'all-unclaimed-rewards') return;
        renderBuyout(currentOptimizerResult);
        buyoutDialog.showModal();
      });

      closeRouteScheduleButton.addEventListener('click', () => routeScheduleDialog.close());
      routeScheduleDialog.addEventListener('click', (event) => {
        if (event.target === routeScheduleDialog) routeScheduleDialog.close();
      });
      closeBuyoutButton.addEventListener('click', () => buyoutDialog.close());
      buyoutDialog.addEventListener('click', (event) => {
        if (event.target === buyoutDialog) buyoutDialog.close();
      });

      const modeData = [
        ['pvp-seasonal', 'mode.pvpSeasonal'],
        ['pvp', 'mode.pvp'],
        ['pve', 'mode.pve'],
      ].map(([mode, labelId]) => {
        const limit = formatNumber(catalogs.optimizerRules.dailyDocumentLimits[mode], localizer.locale);
        return {
          text: `${localizer.text(labelId)} · ${limit} / ${localizer.text('ui.day')}`,
          value: mode,
          selected: mode === state.mode,
        };
      });

      new SlimSelect({
        select: modeSelect,
        data: modeData,
        settings: {
          ariaLabel: localizer.text('optimizer.mode'),
          modal: 'off',
          showSearch: false,
        },
        events: {
          afterChange: (selection) => {
            const mode = selection[0]?.value;
            if (mode && mode !== state.mode) dispatch({ type: 'set-mode', mode });
          },
        },
      });

      const languageNames = new Intl.DisplayNames([localizer.locale], { type: 'language' });
      const englishName = languageNames.of('en') ?? 'en';
      const localeChoice = document.createElement('span');
      localeChoice.className = 'locale-choice';
      const localeFlag = document.createElement('img');
      localeFlag.className = 'locale-choice__flag';
      localeFlag.src = englishFlagUrl;
      localeFlag.alt = '';
      const localeName = document.createElement('span');
      localeName.className = 'locale-choice__name';
      localeName.textContent = englishName;
      localeChoice.append(localeFlag, localeName);

      new SlimSelect({
        select: languageSelect,
        data: [{ text: englishName, value: 'en', html: localeChoice.outerHTML, selected: true }],
        settings: {
          ariaLabel: localizer.text('ui.locale'),
          modal: 'off',
          showSearch: false,
        },
      });

      refreshOptimization();

      const updateTimer = () => {
        const totalSeconds = Math.max(0, Math.ceil(endsAt - Date.now() / 1000));
        if (totalSeconds === 0) {
          timer.textContent = localizer.text('season.ended');
          return false;
        }

        const days = Math.floor(totalSeconds / 86400);
        const hours = Math.floor((totalSeconds % 86400) / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const compact = `${days}d ${hours}h ${minutes}m`;
        const accessible = [
          formatCountdownUnit(days, localizer.locale, 'day'),
          formatCountdownUnit(hours, localizer.locale, 'hour'),
          formatCountdownUnit(minutes, localizer.locale, 'minute'),
        ].join(', ');
        timer.textContent = compact;
        timer.setAttribute('aria-label', localizer.text('season.countdown', { time: accessible }));
        return true;
      };

      if (updateTimer()) {
        const timerId = window.setInterval(() => {
          if (!updateTimer()) window.clearInterval(timerId);
        }, 1000);
      }
    </script>
  </body>
</html>
