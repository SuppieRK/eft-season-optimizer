<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KORD BREACH — Layout Wireframe</title>
    <link rel="stylesheet" href="./src/typography.css" />
    <link rel="stylesheet" href="./src/spacing.css" />
    <style>
      :root {
        --canvas-width: 94vw;
        --canvas-height: 94vh;
        --canvas-min-width: 1180px;
        --canvas-min-height: 720px;
        --workspace-height: clamp(500px, 62vh, 720px);
        --grid-gap: var(--space-m);
        --header-height: clamp(96px, 10vh, 160px);
        --reward-column: 24.4fr;
        --focus-column: 50.3fr;
        --detail-column: 25.3fr;
        --section-heading-height: clamp(54px, 5.2vh, 84px);
        --document-strip-image-size: clamp(64px, 5vw, 96px);
        --header-control-padding-block: var(--space-s);
        --header-control-padding-inline: calc(var(--space-s) + var(--space-xxs));
        --header-control-chevron-gap: var(--header-control-padding-inline);
        --header-control-chevron-correction: 0.125em;
        --line: #697078;
        --line-muted: #41464d;
        --surface: #17191c;
        --surface-alt: #1d2024;
        --label: #d7d9dc;
        --label-muted: #a8adb3;
        --document-frame: #4f8175;
        --classified-frame: #8d5155;
        --reward-complete-background:
          linear-gradient(
            90deg,
            color-mix(in srgb, var(--document-frame) 10%, transparent),
            color-mix(in srgb, var(--document-frame) 30%, transparent)
          );
        --reward-redeemable-background:
          linear-gradient(
            90deg,
            color-mix(in srgb, var(--document-frame) 6%, transparent),
            color-mix(in srgb, var(--document-frame) 16%, transparent)
          );
        --tooltip-surface: #050607;
        --tooltip-line: #777e84;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-width: var(--canvas-min-width);
        min-height: var(--canvas-min-height);
        margin: 0;
      }

      body {
        min-block-size: 100vh;
        overflow: auto;
        background: #0f1012;
        color: var(--label);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", monospace;
      }

      .wireframe-shell {
        display: grid;
        grid-template-rows: var(--header-height) var(--workspace-height) auto;
        gap: var(--grid-gap);
        inline-size: var(--canvas-width);
        min-inline-size: calc(var(--canvas-min-width) - 6vw);
        block-size: auto;
        min-block-size: calc(var(--canvas-min-height) - 6vh);
        margin: 3vh auto;
      }

      .wireframe-header,
      .wireframe-workspace {
        display: grid;
        grid-template-columns:
          var(--reward-column)
          var(--focus-column)
          var(--detail-column);
        column-gap: var(--grid-gap);
        min-block-size: 0;
      }

      .wireframe-workspace {
        grid-template-areas: "reward focus focus";
        grid-template-rows: minmax(0, 1fr);
      }

      .region,
      .slot {
        position: relative;
        min-inline-size: 0;
        min-block-size: 0;
      }

      .region {
        border: 1px solid var(--line);
        background:
          linear-gradient(135deg, transparent 0 49.8%, #22262a 50% 50.2%, transparent 50.4%)
            0 0 / 28px 28px,
          var(--surface);
      }

      .slot {
        background: color-mix(in srgb, var(--surface-alt) 82%, transparent);
      }

      .region-label,
      .slot-label {
        position: absolute;
        z-index: 1;
        inset-block-start: var(--space-s);
        inset-inline-start: var(--space-s);
        max-inline-size: calc(100% - (2 * var(--space-s)));
        padding: var(--space-xxs) var(--space-xs);
        background: var(--surface);
        color: var(--label);
        font-size: var(--font-size-label);
        font-weight: 700;
        line-height: var(--line-height-ui);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .slot-label {
        color: var(--label-muted);
        font-size: var(--font-size-caption);
        font-weight: 600;
      }

      .region > .region-label {
        inset-inline-start: auto;
        inset-inline-end: var(--space-s);
      }

      .header-slot {
        border: 1px solid var(--line);
        background: var(--surface-alt);
      }

      .season-slot {
        display: flex;
        align-items: center;
        gap: var(--space-m);
        padding: var(--space-m);
      }

      .season-number {
        padding-inline-end: var(--space-m);
        border-inline-end: 1px solid var(--line-muted);
        color: var(--label-muted);
        font-size: var(--font-size-display);
        font-weight: 700;
        line-height: 0.81;
      }

      .season-details {
        display: grid;
        gap: var(--space-xs);
        min-inline-size: 0;
      }

      .season-name,
      .season-timer {
        white-space: nowrap;
      }

      .season-name {
        overflow: hidden;
        font-size: var(--font-size-body);
        letter-spacing: 0.08em;
        text-overflow: ellipsis;
      }

      .season-timer {
        color: var(--label-muted);
        font-size: var(--font-size-label);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.05em;
      }

      .primary-navigation-slot {
        display: grid;
        grid-template-columns: minmax(120px, 1fr) minmax(110px, 0.85fr) auto;
        align-items: center;
        gap: var(--space-l);
        padding: var(--space-m);
      }

      .navigation-progress {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: end;
        gap: var(--space-xs) var(--space-s);
        min-inline-size: 0;
      }

      .navigation-progress__label {
        overflow: hidden;
        color: var(--label-muted);
        font-size: var(--font-size-label);
        font-weight: 700;
        line-height: var(--line-height-ui);
        letter-spacing: 0.08em;
        text-overflow: ellipsis;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .navigation-progress__label-line {
        display: flex;
        align-items: baseline;
        gap: var(--space-xs);
        min-inline-size: 0;
      }

      .navigation-progress__buyout {
        flex: 0 0 auto;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--document-frame);
        font: inherit;
        font-size: var(--font-size-label);
        font-weight: 700;
        line-height: var(--line-height-ui);
        text-decoration: underline;
        text-underline-offset: 0.2em;
        cursor: pointer;
      }

      .navigation-progress__buyout:hover {
        color: var(--label);
      }

      .navigation-progress__buyout:focus-visible {
        outline: 2px solid var(--label);
        outline-offset: var(--space-xxs);
      }

      .navigation-progress__value {
        color: var(--label);
        font-size: var(--font-size-label);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: var(--line-height-ui);
        white-space: nowrap;
      }

      .navigation-progress__separator {
        padding-inline: var(--space-xxs);
        color: var(--label-muted);
      }

      .navigation-progress progress {
        grid-column: 1 / -1;
        inline-size: 100%;
        block-size: 4px;
        overflow: hidden;
        border: 0;
        border-radius: 0;
        appearance: none;
        background: var(--line-muted);
      }

      .navigation-progress progress::-webkit-progress-bar {
        background: var(--line-muted);
      }

      .navigation-progress progress::-webkit-progress-value {
        background: var(--label);
      }

      .navigation-progress progress::-moz-progress-bar {
        background: var(--label);
      }

      .route-profile-toggle {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        margin: 0;
        padding: 0;
        border: 1px solid var(--line-muted);
      }

      .route-profile-option {
        position: relative;
        cursor: pointer;
      }

      .route-profile-option + .route-profile-option {
        border-inline-start: 1px solid var(--line-muted);
      }

      .route-profile-option input {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        opacity: 0;
      }

      .route-profile-option span {
        display: grid;
        place-items: center;
        min-inline-size: clamp(76px, 5vw, 104px);
        padding-block: var(--header-control-padding-block);
        padding-inline: var(--header-control-padding-inline);
        color: var(--label-muted);
        font-size: var(--font-size-label);
        font-weight: 700;
        line-height: var(--line-height-ui);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .route-profile-option input:checked + span {
        background: var(--label);
        color: var(--surface);
      }

      .route-profile-option input:focus-visible + span {
        outline: 2px solid var(--label);
        outline-offset: 2px;
      }

      .visually-hidden {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      .account-slot {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: var(--space-s);
        padding: var(--space-s);
      }

      .header-select-shell,
      .ss-main.header-select,
      .ss-content.header-select {
        color: var(--label);
        font-family: inherit;
        font-size: var(--font-size-label);
        font-weight: 700;
        --ss-bg-color: var(--surface);
        --ss-border-color: var(--line-muted);
        --ss-focus-color: var(--label);
        --ss-font-color: var(--label);
        --ss-main-height: auto;
        --ss-option-height: auto;
        --ss-primary-color: var(--line-muted);
        --ss-spacing-s: 0px;
        --ss-spacing-m: var(--space-xs);
        --ss-spacing-l: var(--space-s);
      }

      .ss-main.header-select {
        inline-size: max-content;
        padding-block: var(--header-control-padding-block);
        padding-inline-start: var(--header-control-padding-inline);
        padding-inline-end: calc(
          var(--header-control-padding-inline) - var(--header-control-chevron-correction)
        );
        border-radius: 0;
      }

      .ss-main.header-select:focus {
        box-shadow: 0 0 0 2px var(--label);
      }

      .ss-main.header-select .ss-values {
        flex: 0 1 auto;
        padding: 0;
      }

      .ss-main.header-select .ss-values .ss-single {
        display: flex;
        flex: 0 1 auto;
        align-items: center;
        inline-size: auto;
        max-inline-size: none;
        padding: 0;
        line-height: var(--line-height-ui);
      }

      .ss-main.header-select .ss-arrow {
        inline-size: 10px;
        block-size: 10px;
        margin: 0 0 0 var(--header-control-chevron-gap);
      }

      .ss-main.header-select .ss-arrow path {
        stroke: var(--label-muted);
      }

      .ss-content.header-select {
        border-radius: 0;
      }

      .ss-content.header-select .ss-list .ss-option {
        min-block-size: var(--ss-option-height);
        padding-block: var(--header-control-padding-block);
        padding-inline: var(--header-control-padding-inline);
        color: var(--label);
        line-height: var(--line-height-ui);
      }

      .ss-content.header-select .ss-list .ss-option:hover:not(.ss-disabled),
      .ss-content.header-select .ss-list .ss-option.ss-highlighted,
      .ss-content.header-select .ss-list .ss-option:not(.ss-disabled).ss-selected {
        border-inline-start: 0;
        background: var(--line-muted);
        color: var(--label);
      }

      .mode-select-shell,
      .language-select-shell {
        inline-size: fit-content;
      }

      .ss-main.language-select .ss-single,
      .ss-content.language-select .ss-option {
        justify-content: center;
      }

      .locale-choice {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: var(--space-xs);
        min-block-size: 1.272em;
      }

      .locale-choice__flag {
        display: block;
        inline-size: auto;
        block-size: 1em;
        flex: 0 0 auto;
      }

      .locale-choice__name {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      .reward-rail {
        grid-area: reward;
        display: grid;
        grid-template-rows: var(--section-heading-height) minmax(0, 1fr);
      }

      .focus-stage {
        grid-area: focus;
        display: grid;
        grid-template-rows: var(--section-heading-height) minmax(0, 1fr) auto;
      }

      .focus-heading {
        padding: var(--space-s) var(--space-m);
        border-block-end-style: solid;
      }

      .focus-heading {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: var(--space-m);
      }

      .focus-heading h2 {
        margin: 0;
        font-size: var(--font-size-body);
        line-height: var(--line-height-ui);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .focus-heading__eyebrow {
        display: block;
        margin-block-end: var(--space-xxs);
        color: var(--label-muted);
        font-size: var(--font-size-caption);
        font-weight: 700;
        line-height: var(--line-height-ui);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .focus-heading__actions {
        display: flex;
        align-items: center;
        gap: var(--space-s);
      }

      .focus-heading__actions button {
        min-block-size: 2.618em;
        padding: var(--space-xs) var(--space-m);
        border: 1px solid var(--line-muted);
        border-radius: 0;
        background: transparent;
        color: var(--label);
        font: inherit;
        font-size: var(--font-size-caption);
        font-weight: 700;
        line-height: var(--line-height-ui);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        white-space: nowrap;
        cursor: pointer;
      }

      .focus-heading__actions [data-commit-raid] {
        border-color: var(--document-frame);
        background: color-mix(in srgb, var(--document-frame) 24%, var(--surface));
      }

      .focus-heading__actions button:hover,
      .focus-heading__actions button:focus-visible {
        border-color: var(--label-muted);
        background: var(--line-muted);
        outline: 0;
      }

      .focus-heading__actions [data-commit-raid]:hover,
      .focus-heading__actions [data-commit-raid]:focus-visible {
        background: color-mix(in srgb, var(--document-frame) 42%, var(--surface));
      }

      .focus-heading__actions button:disabled {
        border-color: var(--line-muted);
        background: transparent;
        color: var(--label-muted);
        cursor: default;
        opacity: 0.55;
      }

      .focus-content {
        display: grid;
        align-content: center;
        gap: var(--space-l);
        padding: var(--space-m);
        overflow: auto;
        border-block-end: 0;
        background: color-mix(in srgb, var(--surface) 94%, transparent);
      }

      .focus-loading,
      .focus-message {
        margin: 0;
        color: var(--label-muted);
        font-size: var(--font-size-body);
        line-height: var(--line-height-body);
        text-align: center;
      }

      .focus-message strong {
        display: block;
        margin-block-end: var(--space-xs);
        color: var(--label);
        font-size: var(--font-size-heading);
        line-height: var(--line-height-ui);
      }

      .focus-instruction {
        margin: 0;
        color: var(--label-muted);
        font-size: var(--font-size-label);
        line-height: var(--line-height-body);
        text-align: center;
      }

      .focus-documents {
        display: grid;
        grid-template-columns: repeat(2, minmax(118px, 140px));
        justify-content: center;
        gap: var(--space-xl);
      }

      .focus-document {
        display: grid;
        align-content: start;
        gap: var(--space-s);
        min-inline-size: 0;
        margin: 0;
      }

      .focus-document__status {
        min-block-size: 1lh;
        color: var(--document-frame);
        font-size: var(--font-size-caption);
        font-weight: 700;
        line-height: var(--line-height-ui);
        letter-spacing: 0.08em;
        text-align: center;
        text-transform: uppercase;
      }

      .focus-document--optional .focus-document__status {
        color: var(--label-muted);
      }

      .focus-document__image-frame {
        position: relative;
        aspect-ratio: 1;
        overflow: hidden;
        border: 2px solid var(--document-frame);
        background: var(--surface-alt);
        transition:
          filter 120ms ease-out,
          opacity 120ms ease-out;
      }

      .focus-document--optional .focus-document__image-frame {
        border-color: var(--line-muted);
        filter: grayscale(0.88);
        opacity: 0.34;
      }

      .focus-document__image-frame img {
        display: block;
        inline-size: 100%;
        block-size: 100%;
        object-fit: cover;
      }

      .focus-document figcaption {
        min-block-size: 1lh;
        text-align: center;
      }

      .focus-document figcaption strong {
        overflow-wrap: anywhere;
        font-size: var(--font-size-label);
        line-height: var(--line-height-ui);
      }

      .raid-result-stepper {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        border: 1px solid var(--line-muted);
        background: var(--surface-alt);
      }

      .raid-result-stepper button,
      .raid-result-stepper input {
        min-inline-size: 0;
        block-size: 2.618em;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: var(--label);
        font: inherit;
        font-size: var(--font-size-label);
        font-variant-numeric: tabular-nums;
        line-height: 1;
        text-align: center;
      }

      .raid-result-stepper button {
        inline-size: 2.618em;
        cursor: pointer;
      }

      .raid-result-stepper button:hover {
        background: var(--line-muted);
      }

      .raid-result-stepper input {
        inline-size: 100%;
        border-inline: 1px solid var(--line-muted);
        appearance: textfield;
      }

      .raid-result-stepper input::-webkit-inner-spin-button,
      .raid-result-stepper input::-webkit-outer-spin-button {
        appearance: none;
      }

      .raid-result-stepper button:focus-visible,
      .raid-result-stepper input:focus-visible {
        outline: 2px solid var(--label);
        outline-offset: 2px;
      }

      .route-schedule-dialog,
      .buyout-dialog {
        inline-size: min(900px, calc(100vw - (2 * var(--space-xl))));
        max-block-size: min(760px, calc(100vh - (2 * var(--space-xl))));
        padding: 0;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 0;
        background: var(--surface);
        color: var(--label);
      }

      .route-schedule-dialog::backdrop,
      .buyout-dialog::backdrop {
        background: rgb(0 0 0 / 72%);
      }

      .route-schedule-dialog > header,
      .buyout-dialog > header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-m);
        padding: var(--space-m);
        border-block-end: 1px solid var(--line-muted);
      }

      .route-schedule-dialog h2,
      .buyout-dialog h2 {
        margin: 0;
        font-size: var(--font-size-heading);
      }

      .route-schedule-dialog header strong {
        display: block;
        margin-block-start: var(--space-xxs);
        color: var(--document-frame);
        font-size: var(--font-size-label);
      }

      .route-schedule-dialog header button,
      .buyout-dialog header button {
        padding: var(--space-xs) var(--space-s);
        border: 1px solid var(--line-muted);
        border-radius: 0;
        background: transparent;
        color: var(--label);
        font: inherit;
        cursor: pointer;
      }

      [data-route-schedule-content],
      [data-buyout-content] {
        max-block-size: calc(100vh - 10rem);
        padding: 0 var(--space-m);
        overflow: auto;
      }

      .schedule-plan-actions,
      .schedule-immediate,
      .buyout-section {
        padding-block: var(--space-m);
        border-block-end: 1px solid var(--line-muted);
      }

      .schedule-estimate-note {
        margin: 0;
        padding-block: var(--space-m);
        border-block-end: 1px solid var(--line-muted);
        color: var(--label-muted);
        font-size: var(--font-size-caption);
        line-height: var(--line-height-body);
      }

      .schedule-plan-actions h3,
      .schedule-immediate h3,
      .buyout-section h3 {
        margin: 0 0 var(--space-s);
        font-size: var(--font-size-label);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .schedule-plan-actions h4,
      .schedule-day-column h4,
      .buyout-section h4 {
        margin: 0 0 var(--space-xs);
        color: var(--label-muted);
        font-size: var(--font-size-caption);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .schedule-plan-actions ul,
      .schedule-immediate ul,
      .schedule-day-column ul,
      .buyout-section ul {
        display: grid;
        gap: var(--space-xs);
        margin: 0;
        padding-inline-start: var(--space-l);
      }

      .schedule-plan-actions li,
      .schedule-immediate li,
      .schedule-day-column li,
      .buyout-section li,
      .buyout-section p {
        color: var(--label-muted);
        font-size: var(--font-size-caption);
        line-height: var(--line-height-body);
      }

      .schedule-day-column li strong,
      .schedule-day-column li span {
        display: block;
      }

      .schedule-day-column li strong {
        color: var(--label);
      }

      .schedule-day-column li span {
        margin-block-start: var(--space-xxs);
      }

      .schedule-action-group + .schedule-action-group {
        margin-block-start: var(--space-m);
      }

      .schedule-projection-day {
        display: grid;
        gap: var(--space-s);
        padding-block: var(--space-m);
        border-block-end: 1px solid var(--line-muted);
      }

      .schedule-projection-day h3,
      .schedule-projection-day p,
      .schedule-projection-day ul {
        margin: 0;
      }

      .schedule-projection-day h3 {
        font-size: var(--font-size-label);
      }

      .schedule-projection-day__columns {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);

      .reward-heading__actions button {

      .reward-page__trigger {
        display: grid;

      .reward-page__trigger[aria-expanded="true"] {

      .reward-page__label {
        font-size: var(--font-size-label);
        font-weight: 700;
        line-height: var(--line-height-ui);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .reward-page__redeemable {
        color: var(--document-frame);
        font-size: var(--font-size-caption);
        letter-spacing: 0.04em;

      .reward-page__count {
        color: var(--label-muted);
        font-size: var(--font-size-caption);
        font-variant-numeric: tabular-nums;
        font-weight: 700;
        line-height: var(--line-height-ui);

      .reward-page__panel[hidden] {
        display: none;

      .reward-page__items {
        margin: 0;
        padding: 0;
        list-style: none;

      .reward-item {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        border-block-start: 1px solid color-mix(in srgb, var(--line-muted) 68%, transparent);
      }

      .reward-item::after {
        position: absolute;
        z-index: 2;
        inset-block-start: 50%;
        inset-inline-end: var(--space-l);
        inline-size: 0.55rem;
        block-size: 1rem;
        border-right: 0.15rem solid var(--document-frame);
        border-bottom: 0.15rem solid var(--document-frame);
        content: "";
        opacity: 0;
        pointer-events: none;
        transform: translateY(-62%) rotate(45deg);
        transition: opacity 120ms ease-out;

      .reward-item label {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        align-items: center;
        padding-block: var(--space-s);
        padding-inline: var(--space-m) var(--space-xl);
        cursor: pointer;

      .reward-item input {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;

      .reward-item:has(input:focus-visible) {
        outline: 1px solid var(--label);

      .reward-item__copy {
        display: grid;
        gap: var(--space-xxs);
        min-inline-size: 0;
      }

      .reward-item__name,
      .reward-item__requirements {
        overflow-wrap: anywhere;
      }

      .reward-item__name {
        font-size: var(--font-size-label);
        font-weight: 700;
        line-height: var(--line-height-ui);
      }

      .reward-item__requirements {
        color: var(--label-muted);
        font-size: var(--font-size-caption);
        line-height: var(--line-height-ui);
      }

      .reward-item--redeemable {
        background: var(--reward-redeemable-background);
      }

      .reward-item:has(input:checked) {
        background: var(--reward-complete-background);
      }

      .reward-item:has(input:checked)::after {
        opacity: 0.78;
      }

      .reward-item:has(input:checked) .reward-item__name {
        color: color-mix(in srgb, var(--label) 78%, var(--document-frame));
      }

      .reward-item:has(input:checked) .reward-item__requirements {
        color: color-mix(in srgb, var(--label-muted) 72%, var(--document-frame));
      }

      .reward-crate {
        display: grid;
        gap: var(--space-xxs);
        padding: var(--space-m);
      }

      .redemption-dialog {
        inline-size: min(30rem, calc(100vw - (2 * var(--space-l))));
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 0;
        background: var(--surface);
        color: var(--label);
        box-shadow: 0 1rem 3rem rgb(0 0 0 / 55%);

      .redemption-dialog::backdrop {
        background: rgb(4 7 9 / 78%);

      .redemption-dialog__content {
        display: grid;
        gap: var(--space-m);
        padding: var(--space-l);
      }

      .redemption-dialog h2,
      .redemption-dialog p,
      .redemption-dialog ul {
        margin: 0;
      }

      .redemption-dialog h2 {
        font-size: var(--font-size-heading);
        line-height: var(--line-height-ui);
      }

      .redemption-dialog p,
      .redemption-dialog li {
        font-size: var(--font-size-body);
        line-height: var(--line-height-copy);
      }

      .redemption-dialog ul {
        display: grid;
        gap: var(--space-xs);
        padding-inline-start: var(--space-l);
      }

      .redemption-dialog__actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: var(--space-s);
      }

      .redemption-dialog__actions button {
        padding: var(--space-s) var(--space-m);
        border: 1px solid var(--line-muted);
        border-radius: 0;
        background: transparent;
        color: var(--label);
        font: inherit;
        font-size: var(--font-size-label);
        font-weight: 700;
        cursor: pointer;
      }

      .redemption-dialog__actions button:hover,
      .redemption-dialog__actions button:focus-visible {
        border-color: var(--label-muted);
        background: var(--line-muted);
      }

      .redemption-dialog__actions [data-redemption-subtract] {
        border-color: var(--document-frame);
        color: var(--document-frame);
      }

      .document-strip {
        display: grid;
        align-content: center;
        justify-items: center;
        padding: var(--space-s) var(--space-m);
        overflow: visible;
        border-block-start: 1px solid var(--line-muted);
        background: color-mix(in srgb, var(--surface-alt) 82%, transparent);
      }

      .document-strip__images {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-m);
      }

      .document-strip__item {
        position: relative;
        display: grid;
        grid-template-rows: auto auto auto;
        gap: var(--space-xs);
        inline-size: var(--document-strip-image-size);
        margin: 0;
      }

      .document-strip__title {
        display: grid;
        place-items: center;
        min-block-size: calc(var(--font-size-label) * var(--line-height-ui));
        color: var(--label);
        font-size: var(--font-size-label);
        font-weight: 700;
        line-height: var(--line-height-ui);
        letter-spacing: 0.04em;
        white-space: nowrap;
      }

      .document-strip__image-frame {
        border: 1px solid var(--document-frame);
        background: color-mix(in srgb, var(--document-frame) 10%, var(--surface));
      }

      .document-strip__item--classified .document-strip__image-frame {
        border-color: var(--classified-frame);
        background: color-mix(in srgb, var(--classified-frame) 18%, var(--surface));
      }

      .document-strip__image-frame img {
        display: block;
        inline-size: 100%;
        aspect-ratio: 1;
        object-fit: cover;
      }

      .document-strip__item:hover .document-strip__image-frame,
      .document-strip__item:focus-within .document-strip__image-frame {
        border-color: color-mix(in srgb, var(--document-frame) 55%, var(--label));
      }

      .document-strip__item--classified:hover .document-strip__image-frame,
      .document-strip__item--classified:focus-within .document-strip__image-frame {
        border-color: color-mix(in srgb, var(--classified-frame) 60%, var(--label));
      }

      .document-strip__quantity {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 0;
        inline-size: 100%;
        border: 1px solid var(--line-muted);
        background: var(--surface-alt);
      }

      .document-strip__quantity button,
      .document-strip__quantity input {
        min-inline-size: 0;
        block-size: 1.618em;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: var(--label);
        font: inherit;
        font-size: var(--font-size-label);
        font-variant-numeric: tabular-nums;
        line-height: 1;
        text-align: center;
      }

      .document-strip__quantity button {
        inline-size: 1.618em;
        cursor: pointer;
      }

      .document-strip__quantity button:hover {
        border-color: var(--label-muted);
        background: var(--line-muted);
      }

      .document-strip__quantity button:focus-visible,
      .document-strip__quantity input:focus-visible {
        outline: 2px solid var(--label);
        outline-offset: 2px;
      }

      .document-strip__quantity input {
        inline-size: 100%;
        border-inline: 1px solid var(--line-muted);
        appearance: textfield;
      }

      .document-strip__quantity input::-webkit-inner-spin-button,
      .document-strip__quantity input::-webkit-outer-spin-button {
        margin: 0;
        appearance: none;
      }

      .document-strip__tooltip {
        position: absolute;
        z-index: 10;
        inset-block-end: calc(100% + var(--space-s));
        inset-inline-start: 50%;
        inline-size: clamp(220px, 18vw, 300px);
        padding: var(--space-s);
        border: 1px solid var(--tooltip-line);
        background: var(--tooltip-surface);
        color: var(--label-muted);
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, var(--space-xs));
        transition:
          opacity 120ms ease-out,
          transform 120ms ease-out;
      }

      .document-strip__tooltip strong {
        display: block;
        margin-block-end: var(--space-xs);
        color: var(--label);
        font-size: var(--font-size-label);
        line-height: var(--line-height-ui);
      }

      .document-strip__tooltip p {
        margin: 0;
        font-size: var(--font-size-label);
        line-height: var(--line-height-body);
      }

      .document-strip__tooltip ul {
        margin: var(--space-s) 0 0;
        padding-block-start: var(--space-s);
        padding-inline-start: var(--space-m);
        border-block-start: 1px solid var(--line-muted);
        font-size: var(--font-size-label);
        line-height: var(--line-height-ui);
      }

      .document-strip__tooltip li + li {
        margin-block-start: var(--space-xxs);
      }

      .document-strip__item:hover .document-strip__tooltip,
      .document-strip__item:focus-within .document-strip__tooltip {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      .wireframe-footer {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-s);
        max-inline-size: 76rem;
        margin-inline: auto;
        padding: var(--space-s) var(--space-m);
        border-block-start: 1px solid var(--line-muted);
        text-align: center;
      }

      .wireframe-footer__disclaimer {
        margin: 0;
        color: var(--label-muted);
        font-size: var(--font-size-caption);
        line-height: var(--line-height-body);
      }

      .wireframe-footer__separator {
        flex: 0 0 1px;
        align-self: stretch;
        min-block-size: 1em;
        background: var(--line-muted);
      }

      .wireframe-footer__reset {
        flex: 0 0 auto;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--document-frame);
        font: inherit;
        font-size: var(--font-size-caption);
        font-weight: 700;
        line-height: var(--line-height-ui);
        text-decoration: underline;
        text-underline-offset: 0.2em;
        cursor: pointer;
      }

      .wireframe-footer__reset:hover {
        color: var(--label);
      }

      .wireframe-footer__reset:focus-visible {
        outline: 2px solid var(--label);
        outline-offset: var(--space-xxs);
      }

      @media (max-width: 52rem) {
        :root {
          --canvas-width: calc(100vw - (2 * var(--space-m)));
          --canvas-height: auto;
          --canvas-min-width: 320px;
          --canvas-min-height: 0px;
          --header-height: auto;
          --workspace-height: auto;
        }

        html,
        body {
          min-width: 320px;
          min-height: 0;
        }

        .wireframe-shell {
          grid-template-rows: auto auto auto;
          inline-size: var(--canvas-width);
          min-inline-size: 0;
          block-size: auto;
          min-block-size: 0;
          margin: var(--space-m) auto;
        }

        .wireframe-header {
          grid-template-columns: minmax(0, 1fr);
          row-gap: var(--grid-gap);
        }

        .wireframe-workspace {
          grid-template-areas:

            "reward";
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: auto;
          row-gap: var(--grid-gap);
        }

        .primary-navigation-slot {
          grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);

        .navigation-progress {
          grid-template-columns: minmax(0, 1fr);
          align-items: start;
        }

        .navigation-progress__value {
          justify-self: end;
        }

        .navigation-progress progress {
          grid-column: 1;
        }

        .route-profile-toggle {
          grid-column: 1 / -1;
        }

        .account-slot {
          justify-content: space-between;
        }

        .reward-rail,
        .focus-stage {
          grid-template-rows: auto;
        }

        .focus-stage {
          grid-template-rows: auto auto auto;
        }

        .focus-heading {
          grid-template-columns: minmax(0, 1fr);
        }

        .focus-heading__actions {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .focus-heading__actions button {
          white-space: normal;
        }

        .focus-content {
          overflow: visible;
        }

        .focus-documents {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: var(--space-m);
        }

        .reward-content {
          overflow: visible;
        }

        .document-strip {
          justify-items: start;
          max-inline-size: 100%;
          overflow-x: auto;
        }

        .document-strip__images {
          justify-content: flex-start;
          min-inline-size: max-content;
        }

        .schedule-projection-day__columns {
          grid-template-columns: minmax(0, 1fr);
        }

        .schedule-day-column + .schedule-day-column {
          padding-block-start: var(--space-m);
          padding-inline-start: 0;
          border-block-start: 1px solid var(--line-muted);
          border-inline-start: 0;
        }

        .wireframe-footer {
          flex-direction: column;
          gap: var(--space-xs);
        }

        .wireframe-footer__separator {
          align-self: auto;
          inline-size: min(12rem, 100%);
          min-block-size: 0;
          block-size: 1px;
        }
      }

    </style>

              <div class="document-strip__quantity">
                <button type="button" data-document-decrement>−</button>

            <figure class="document-strip__item" data-document-id="documents.user.name">
              <figcaption class="document-strip__title" data-document-title></figcaption>
              <div class="document-strip__image-frame"><img src="./assets/documents/user.png" alt="" /></div>
              <div class="document-strip__quantity">
                <button type="button" data-document-decrement>−</button>
                <input type="number" min="0" step="1" value="0" data-document-quantity />
                <button type="button" data-document-increment>+</button>

              <figcaption class="document-strip__title" data-document-title></figcaption>

              <div class="document-strip__quantity">
                <button type="button" data-document-decrement>−</button>

              <figcaption class="document-strip__title" data-document-title></figcaption>
              <div class="document-strip__image-frame"><img src="./assets/documents/technical.png" alt="" /></div>
              <div class="document-strip__quantity">
                <button type="button" data-document-decrement>−</button>
                <input type="number" min="0" step="1" value="0" data-document-quantity />
                <button type="button" data-document-increment>+</button>

              <div class="document-strip__tooltip" role="tooltip">
                <strong data-document-tooltip-name></strong>
                <p data-document-tooltip-description></p>

            </figure>
            <figure class="document-strip__item document-strip__item--classified" data-document-id="documents.classified.name">
              <figcaption class="document-strip__title" data-document-title></figcaption>
              <div class="document-strip__image-frame"><img src="./assets/documents/classified.png" alt="" /></div>
              <div class="document-strip__quantity">
                <button type="button" data-document-decrement>−</button>
                <input type="number" min="0" step="1" value="0" data-document-quantity />
                <button type="button" data-document-increment>+</button>
