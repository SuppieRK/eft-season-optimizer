<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KORD BREACH — Layout Wireframe</title>
    <link rel="stylesheet" href="./src/typography.css" />
    <link rel="stylesheet" href="./src/spacing.css" />
    <style>
      :root {
        --canvas-width: 94vw;
        --canvas-height: 94vh;
        --canvas-min-width: 1180px;
        --canvas-min-height: 720px;
        --grid-gap: var(--space-m);
        --header-height: clamp(96px, 10vh, 160px);
        --lower-band-height: clamp(136px, 13vh, 200px);
        --reward-column: 24.4fr;
        --focus-column: 50.3fr;
        --detail-column: 25.3fr;
        --section-heading-height: clamp(54px, 5.2vh, 84px);
        --detail-content-height: clamp(132px, 16vh, 244px);
        --primary-action-height: clamp(54px, 6vh, 90px);
        --document-strip-image-size: clamp(64px, 5vw, 96px);
        --header-control-padding-block: var(--space-s);
        --header-control-padding-inline: calc(var(--space-s) + var(--space-xxs));
        --header-control-chevron-gap: var(--header-control-padding-inline);
        --header-control-chevron-correction: 0.125em;
        --line: #697078;
        --line-muted: #41464d;
        --surface: #17191c;
        --surface-alt: #1d2024;
        --label: #d7d9dc;
        --label-muted: #a8adb3;
        --document-frame: #4f8175;
        --classified-frame: #8d5155;
        --tooltip-surface: #050607;
        --tooltip-line: #777e84;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-width: var(--canvas-min-width);
        min-height: var(--canvas-min-height);
        margin: 0;
      }

      body {
        min-block-size: 100vh;
        overflow: auto;
        background: #0f1012;
        color: var(--label);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", monospace;
      }

      .wireframe-shell {
        display: grid;
        grid-template-rows: var(--header-height) minmax(0, 1fr);
        gap: var(--grid-gap);
        inline-size: var(--canvas-width);
        min-inline-size: calc(var(--canvas-min-width) - 6vw);
        block-size: var(--canvas-height);
        min-block-size: calc(var(--canvas-min-height) - 6vh);
        margin: 3vh auto;
      }

      .wireframe-header,
      .wireframe-workspace {
        display: grid;
        grid-template-columns:
          var(--reward-column)
          var(--focus-column)
          var(--detail-column);
        column-gap: var(--grid-gap);
        min-block-size: 0;
      }

      .wireframe-workspace {
        grid-template-areas:
          "reward focus detail"
          "documents documents documents";
        grid-template-rows: minmax(0, 1fr) var(--lower-band-height);
        row-gap: var(--grid-gap);
      }

      .region,
      .slot {
        position: relative;
        min-inline-size: 0;
        min-block-size: 0;
      }

      .region {
        border: 1px solid var(--line);
        background:
          linear-gradient(135deg, transparent 0 49.8%, #22262a 50% 50.2%, transparent 50.4%)
            0 0 / 28px 28px,
          var(--surface);
      }

      .slot {
        background: color-mix(in srgb, var(--surface-alt) 82%, transparent);
      }

      .region-label,
      .slot-label {
        position: absolute;
        z-index: 1;
        inset-block-start: var(--space-s);
        inset-inline-start: var(--space-s);
        max-inline-size: calc(100% - (2 * var(--space-s)));
        padding: var(--space-xxs) var(--space-xs);
        background: var(--surface);
        color: var(--label);
        font-size: var(--font-size-label);
        font-weight: 700;
        line-height: var(--line-height-ui);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .slot-label {
        color: var(--label-muted);
        font-size: var(--font-size-caption);
        font-weight: 600;
      }

      .region > .region-label {
        inset-inline-start: auto;
        inset-inline-end: var(--space-s);
      }

      .header-slot {
        border: 1px solid var(--line);
        background: var(--surface-alt);
      }

      .season-slot {
        display: flex;
        align-items: center;
        gap: var(--space-m);
        padding: var(--space-m);
      }

      .season-number {
        padding-inline-end: var(--space-m);
        border-inline-end: 1px solid var(--line-muted);
        color: var(--label-muted);
        font-size: var(--font-size-display);
        font-weight: 700;
        line-height: 0.81;
      }

      .season-details {
        display: grid;
        gap: var(--space-xs);
        min-inline-size: 0;
      }

      .season-name,
      .season-timer {
        white-space: nowrap;
      }

      .season-name {
        overflow: hidden;
        font-size: var(--font-size-body);
        letter-spacing: 0.08em;
        text-overflow: ellipsis;
      }

      .season-timer {
        color: var(--label-muted);
        font-size: var(--font-size-label);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.05em;
      }

      .primary-navigation-slot {
        display: grid;
        grid-template-columns: minmax(120px, 1fr) minmax(110px, 0.85fr) auto;
        align-items: center;
        gap: var(--space-l);
        padding: var(--space-m);
      }

      .navigation-progress {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: end;
        gap: var(--space-xs) var(--space-s);
        min-inline-size: 0;
      }

      .navigation-progress__label {
        overflow: hidden;
        color: var(--label-muted);
        font-size: var(--font-size-label);
        font-weight: 700;
        line-height: var(--line-height-ui);
        letter-spacing: 0.08em;
        text-overflow: ellipsis;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .navigation-progress__value {
        color: var(--label);
        font-size: var(--font-size-label);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: var(--line-height-ui);
        white-space: nowrap;
      }

      .navigation-progress__separator {
        padding-inline: var(--space-xxs);
        color: var(--label-muted);
      }

      .navigation-progress progress {
        grid-column: 1 / -1;
        inline-size: 100%;
        block-size: 4px;
        overflow: hidden;
        border: 0;
        border-radius: 0;
        appearance: none;
        background: var(--line-muted);
      }

      .navigation-progress progress::-webkit-progress-bar {
        background: var(--line-muted);
      }

      .navigation-progress progress::-webkit-progress-value {
        background: var(--label);
      }

      .navigation-progress progress::-moz-progress-bar {
        background: var(--label);
      }

      .route-profile-toggle {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        margin: 0;
        padding: 0;
        border: 1px solid var(--line-muted);
      }

      .route-profile-option {
        position: relative;
        cursor: pointer;
      }

      .route-profile-option + .route-profile-option {
        border-inline-start: 1px solid var(--line-muted);
      }

      .route-profile-option input {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        opacity: 0;
      }

      .route-profile-option span {
        display: grid;
        place-items: center;
        min-inline-size: clamp(76px, 5vw, 104px);
        padding-block: var(--header-control-padding-block);
        padding-inline: var(--header-control-padding-inline);
        color: var(--label-muted);
        font-size: var(--font-size-label);
        font-weight: 700;
        line-height: var(--line-height-ui);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .route-profile-option input:checked + span {
        background: var(--label);
        color: var(--surface);
      }

      .route-profile-option input:focus-visible + span {
        outline: 2px solid var(--label);
        outline-offset: 2px;
      }

      .visually-hidden {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      .account-slot {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: var(--space-s);
        padding: var(--space-s);
      }

      .header-select-shell,
      .ss-main.header-select,
      .ss-content.header-select {
        color: var(--label);
        font-family: inherit;
        font-size: var(--font-size-label);
        font-weight: 700;
        --ss-bg-color: var(--surface);
        --ss-border-color: var(--line-muted);
        --ss-focus-color: var(--label);
        --ss-font-color: var(--label);
        --ss-main-height: auto;
        --ss-option-height: auto;
        --ss-primary-color: var(--line-muted);
        --ss-spacing-s: 0px;
        --ss-spacing-m: var(--space-xs);
        --ss-spacing-l: var(--space-s);
      }

      .ss-main.header-select {
        inline-size: max-content;
        padding-block: var(--header-control-padding-block);
        padding-inline-start: var(--header-control-padding-inline);
        padding-inline-end: calc(
          var(--header-control-padding-inline) - var(--header-control-chevron-correction)
        );
        border-radius: 0;
      }

      .ss-main.header-select:focus {
        box-shadow: 0 0 0 2px var(--label);
      }

      .ss-main.header-select .ss-values {
        flex: 0 1 auto;
        padding: 0;
      }

      .ss-main.header-select .ss-values .ss-single {
        display: flex;
        flex: 0 1 auto;
        align-items: center;
        inline-size: auto;
        max-inline-size: none;
        padding: 0;
        line-height: var(--line-height-ui);
      }

      .ss-main.header-select .ss-arrow {
        inline-size: 10px;
        block-size: 10px;
        margin: 0 0 0 var(--header-control-chevron-gap);
      }

      .ss-main.header-select .ss-arrow path {
        stroke: var(--label-muted);
      }

      .ss-content.header-select {
        border-radius: 0;
      }

      .ss-content.header-select .ss-list .ss-option {
        min-block-size: var(--ss-option-height);
        padding-block: var(--header-control-padding-block);
        padding-inline: var(--header-control-padding-inline);
        color: var(--label);
        line-height: var(--line-height-ui);
      }

      .ss-content.header-select .ss-list .ss-option:hover:not(.ss-disabled),
      .ss-content.header-select .ss-list .ss-option.ss-highlighted,
      .ss-content.header-select .ss-list .ss-option:not(.ss-disabled).ss-selected {
        border-inline-start: 0;
        background: var(--line-muted);
        color: var(--label);
      }

      .mode-select-shell,
      .language-select-shell {
        inline-size: fit-content;
      }

      .ss-main.language-select .ss-single,
      .ss-content.language-select .ss-option {
        justify-content: center;
      }

      .locale-choice {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: var(--space-xs);
        min-block-size: 1.272em;
      }

      .locale-choice__flag {
        display: block;
        inline-size: auto;
        block-size: 1em;
        flex: 0 0 auto;
      }

      .locale-choice__name {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      .reward-rail {
        grid-area: reward;
        display: grid;
        grid-template-rows: var(--section-heading-height) minmax(0, 1fr);
      }

      .focus-stage {
        grid-area: focus;
        display: grid;
        grid-template-rows: var(--section-heading-height) minmax(0, 1fr);
      }

      .detail-rail {
        display: grid;
        grid-template-rows:
          var(--section-heading-height)
          var(--detail-content-height)
          var(--primary-action-height)
          minmax(0, 1fr);
      }

      .detail-rail {
        grid-area: detail;
      }

      .section-heading,
      .detail-content,
      .primary-action {
        border-block-end: 1px dashed var(--line-muted);
      }

      .reward-heading {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: var(--space-s);
        padding: var(--space-s) var(--space-m);
        border-block-end-style: solid;
      }

      .reward-heading h2 {
        margin: 0;
        overflow: hidden;
        font-size: var(--font-size-body);
        line-height: var(--line-height-ui);
        letter-spacing: 0.06em;
        text-overflow: ellipsis;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .reward-heading__actions {
        display: flex;
        gap: var(--space-xs);
      }

      .reward-heading__actions button,
      .reward-page__trigger {
        border: 0;
        border-radius: 0;
        background: transparent;
        color: var(--label);
        font: inherit;
        cursor: pointer;
      }

      .reward-heading__actions button {
        padding: var(--space-xs) var(--space-s);
        border: 1px solid var(--line-muted);
        font-size: var(--font-size-caption);
        font-weight: 700;
        line-height: var(--line-height-ui);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .reward-heading__actions button:hover,
      .reward-heading__actions button:focus-visible {
        border-color: var(--label-muted);
        background: var(--line-muted);
      }

      .reward-heading__actions button:disabled {
        opacity: 0.45;
        cursor: default;
      }

      .reward-content {
        overflow: auto;
        border-block-end: 0;
        background: color-mix(in srgb, var(--surface) 92%, transparent);
        scrollbar-color: var(--line) var(--surface);
        scrollbar-width: thin;
      }

      .reward-page + .reward-page {
        border-block-start: 1px solid var(--line-muted);
      }

      .reward-page__trigger {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        align-items: center;
        gap: var(--space-m);
        inline-size: 100%;
        padding: var(--space-s) var(--space-m);
        text-align: start;
      }

      .reward-page__chevron {
        display: block;
        inline-size: 0.75em;
        block-size: 0.75em;
        color: var(--label-muted);
        transform: rotate(0deg);
        transform-origin: center;
        transition: transform 120ms ease-out;
      }

      .reward-page__trigger[aria-expanded="true"] {
        background: var(--line-muted);
      }

      .reward-page__trigger[aria-expanded="true"] .reward-page__chevron {
        transform: rotate(180deg);
      }

      .reward-page__label {
        font-size: var(--font-size-label);
        font-weight: 700;
        line-height: var(--line-height-ui);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .reward-page__count {
        color: var(--label-muted);
        font-size: var(--font-size-caption);
        font-variant-numeric: tabular-nums;
        font-weight: 700;
        line-height: var(--line-height-ui);
      }

      .reward-page__panel[hidden] {
        display: none;
      }

      .reward-page__items {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .reward-item {
        border-block-start: 1px solid color-mix(in srgb, var(--line-muted) 68%, transparent);
      }

      .reward-item label {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: center;
        gap: var(--space-s);
        padding: var(--space-s) var(--space-m);
        cursor: pointer;
      }

      .reward-item input {
        inline-size: 1em;
        block-size: 1em;
        margin: 0;
        accent-color: var(--document-frame);
      }

      .reward-item__copy {
        display: grid;
        gap: var(--space-xxs);
        min-inline-size: 0;
      }

      .reward-item__name,
      .reward-item__requirements {
        overflow-wrap: anywhere;
      }

      .reward-item__name {
        font-size: var(--font-size-label);
        font-weight: 700;
        line-height: var(--line-height-ui);
      }

      .reward-item__requirements {
        color: var(--label-muted);
        font-size: var(--font-size-caption);
        line-height: var(--line-height-ui);
      }

      .reward-item:has(input:checked) .reward-item__name,
      .reward-item:has(input:checked) .reward-item__requirements {
        color: var(--label-muted);
        text-decoration: line-through;
      }

      .reward-crate {
        display: grid;
        gap: var(--space-xxs);
        padding: var(--space-m);
      }

      .document-strip {
        grid-area: documents;
        display: grid;
        place-items: center;
      }

      .document-strip__images {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-m);
      }

      .document-strip__item {
        position: relative;
        display: grid;
        grid-template-rows: auto auto auto;
        gap: var(--space-xs);
        inline-size: var(--document-strip-image-size);
        margin: 0;
      }

      .document-strip__title {
        display: grid;
        place-items: center;
        min-block-size: calc(var(--font-size-label) * var(--line-height-ui));
        color: var(--label);
        font-size: var(--font-size-label);
        font-weight: 700;
        line-height: var(--line-height-ui);
        letter-spacing: 0.04em;
        white-space: nowrap;
      }

      .document-strip__image-frame {
        border: 1px solid var(--document-frame);
        background: color-mix(in srgb, var(--document-frame) 10%, var(--surface));
      }

      .document-strip__item--classified .document-strip__image-frame {
        border-color: var(--classified-frame);
        background: color-mix(in srgb, var(--classified-frame) 18%, var(--surface));
      }

      .document-strip__image-frame img {
        display: block;
        inline-size: 100%;
        aspect-ratio: 1;
        object-fit: cover;
      }

      .document-strip__item:hover .document-strip__image-frame,
      .document-strip__item:focus-within .document-strip__image-frame {
        border-color: color-mix(in srgb, var(--document-frame) 55%, var(--label));
      }

      .document-strip__item--classified:hover .document-strip__image-frame,
      .document-strip__item--classified:focus-within .document-strip__image-frame {
        border-color: color-mix(in srgb, var(--classified-frame) 60%, var(--label));
      }

      .document-strip__quantity {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 0;
        inline-size: 100%;
        border: 1px solid var(--line-muted);
        background: var(--surface-alt);
      }

      .document-strip__quantity button,
      .document-strip__quantity input {
        min-inline-size: 0;
        block-size: 1.618em;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: var(--label);
        font: inherit;
        font-size: var(--font-size-label);
        font-variant-numeric: tabular-nums;
        line-height: 1;
        text-align: center;
      }

      .document-strip__quantity button {
        inline-size: 1.618em;
        cursor: pointer;
      }

      .document-strip__quantity button:hover {
        border-color: var(--label-muted);
        background: var(--line-muted);
      }

      .document-strip__quantity button:focus-visible,
      .document-strip__quantity input:focus-visible {
        outline: 2px solid var(--label);
        outline-offset: 2px;
      }

      .document-strip__quantity input {
        inline-size: 100%;
        border-inline: 1px solid var(--line-muted);
        appearance: textfield;
      }

      .document-strip__quantity input::-webkit-inner-spin-button,
      .document-strip__quantity input::-webkit-outer-spin-button {
        margin: 0;
        appearance: none;
      }

      .document-strip__tooltip {
        position: absolute;
        z-index: 10;
        inset-block-end: calc(100% + var(--space-s));
        inset-inline-start: 50%;
        inline-size: clamp(220px, 18vw, 300px);
        padding: var(--space-s);
        border: 1px solid var(--tooltip-line);
        background: var(--tooltip-surface);
        color: var(--label-muted);
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, var(--space-xs));
        transition:
          opacity 120ms ease-out,
          transform 120ms ease-out;
      }

      .document-strip__tooltip strong {
        display: block;
        margin-block-end: var(--space-xs);
        color: var(--label);
        font-size: var(--font-size-label);
        line-height: var(--line-height-ui);
      }

      .document-strip__tooltip p {
        margin: 0;
        font-size: var(--font-size-label);
        line-height: var(--line-height-body);
      }

      .document-strip__tooltip ul {
        margin: var(--space-s) 0 0;
        padding-block-start: var(--space-s);
        padding-inline-start: var(--space-m);
        border-block-start: 1px solid var(--line-muted);
        font-size: var(--font-size-label);
        line-height: var(--line-height-ui);
      }

      .document-strip__tooltip li + li {
        margin-block-start: var(--space-xxs);
      }

      .document-strip__item:hover .document-strip__tooltip,
      .document-strip__item:focus-within .document-strip__tooltip {
        opacity: 1;
        transform: translate(-50%, 0);
      }

    </style>
  </head>
  <body>
    <div class="wireframe-shell">
      <header class="wireframe-header" aria-label="Header">
        <section class="slot header-slot season-slot" aria-label="Season identity">
          <span class="season-number" aria-label="Season 1">S1</span>
          <div class="season-details">
            <strong class="season-name" data-season-name>…</strong>
            <time class="season-timer" data-season-timer>…</time>
          </div>
        </section>
        <section class="slot header-slot primary-navigation-slot" aria-label="Primary navigation">
          <div class="navigation-progress">
            <span class="navigation-progress__label" data-document-progress-label>…</span>
            <strong class="navigation-progress__value">
              <span data-document-progress-current>…</span><span class="navigation-progress__separator" aria-hidden="true">/</span><span data-document-progress-total>…</span>
            </strong>
            <progress data-document-progress value="0" max="1"></progress>
          </div>
          <div class="navigation-progress">
            <span class="navigation-progress__label" data-reward-progress-label>…</span>
            <strong class="navigation-progress__value">
              <span data-reward-progress-current>…</span><span class="navigation-progress__separator" aria-hidden="true">/</span><span data-reward-progress-total>…</span>
            </strong>
            <progress data-reward-progress value="0" max="1"></progress>
          </div>
          <fieldset class="route-profile-toggle">
            <legend class="visually-hidden" data-route-profile-label>…</legend>
            <label class="route-profile-option">
              <input type="radio" name="route-profile" value="fastest" />
              <span data-fastest-label>…</span>
            </label>
            <label class="route-profile-option">
              <input type="radio" name="route-profile" value="safest" checked />
              <span data-safest-label>…</span>
            </label>
          </fieldset>
        </section>
        <section class="slot header-slot account-slot" aria-label="Back and account utilities">
          <div class="header-select-shell mode-select-shell">
            <select class="header-select mode-select" data-mode-select></select>
          </div>
          <div class="header-select-shell language-select-shell">
            <select class="header-select language-select" data-language-select></select>
          </div>
        </section>
      </header>

      <main class="wireframe-workspace" aria-label="Battle Pass workspace">
        <section class="region reward-rail" aria-labelledby="reward-rail-heading">
          <div class="slot section-heading reward-heading">
            <h2 id="reward-rail-heading" data-reward-heading></h2>
            <div class="reward-heading__actions">
              <button type="button" data-reward-claim-all></button>
              <button type="button" data-reward-clear-all></button>
            </div>
          </div>
          <div class="slot detail-content reward-content" data-reward-pages></div>
        </section>

        <section class="region focus-stage" aria-label="Focus stage">
          <span class="region-label">Focus stage</span>
          <div class="slot section-heading" aria-label="Focus heading">
            <span class="slot-label">Focus heading slot</span>
          </div>
          <div class="slot primary-content" aria-label="Primary content">
            <span class="slot-label">Primary content slot</span>
          </div>
        </section>

        <aside class="region detail-rail" aria-label="Detail rail">
          <span class="region-label">Detail rail</span>
          <div class="slot section-heading" aria-label="Detail heading">
            <span class="slot-label">Detail heading slot</span>
          </div>
          <div class="slot detail-content" aria-label="Detail content">
            <span class="slot-label">Detail content slot</span>
          </div>
          <div class="slot primary-action" aria-label="Primary action">
            <span class="slot-label">Primary action slot</span>
          </div>
        </aside>

        <section class="region document-strip" aria-label="Document strip">
          <div class="document-strip__images">
            <figure class="document-strip__item" data-document-id="documents.financial.name">
              <figcaption class="document-strip__title" data-document-title></figcaption>
              <div class="document-strip__image-frame"><img src="./assets/documents/financial.png" alt="" /></div>
              <div class="document-strip__quantity">
                <button type="button" data-document-decrement>−</button>
                <input type="number" min="0" step="1" value="0" data-document-quantity />
                <button type="button" data-document-increment>+</button>
              </div>
              <div class="document-strip__tooltip" role="tooltip">
                <strong data-document-tooltip-name></strong>
                <p data-document-tooltip-description></p>
              </div>
            </figure>
            <figure class="document-strip__item" data-document-id="documents.pmc.name">
              <figcaption class="document-strip__title" data-document-title></figcaption>
              <div class="document-strip__image-frame"><img src="./assets/documents/pmc.png" alt="" /></div>
              <div class="document-strip__quantity">
                <button type="button" data-document-decrement>−</button>
                <input type="number" min="0" step="1" value="0" data-document-quantity />
                <button type="button" data-document-increment>+</button>
              </div>
              <div class="document-strip__tooltip" role="tooltip">
                <strong data-document-tooltip-name></strong>
                <p data-document-tooltip-description></p>
              </div>
            </figure>
            <figure class="document-strip__item" data-document-id="documents.project.name">
              <figcaption class="document-strip__title" data-document-title></figcaption>
              <div class="document-strip__image-frame"><img src="./assets/documents/project.png" alt="" /></div>
              <div class="document-strip__quantity">
                <button type="button" data-document-decrement>−</button>
                <input type="number" min="0" step="1" value="0" data-document-quantity />
                <button type="button" data-document-increment>+</button>
              </div>
              <div class="document-strip__tooltip" role="tooltip">
                <strong data-document-tooltip-name></strong>
                <p data-document-tooltip-description></p>
              </div>
            </figure>
            <figure class="document-strip__item" data-document-id="documents.blueprints.name">
              <figcaption class="document-strip__title" data-document-title></figcaption>
              <div class="document-strip__image-frame"><img src="./assets/documents/blueprints.png" alt="" /></div>
              <div class="document-strip__quantity">
                <button type="button" data-document-decrement>−</button>
                <input type="number" min="0" step="1" value="0" data-document-quantity />
                <button type="button" data-document-increment>+</button>
              </div>
              <div class="document-strip__tooltip" role="tooltip">
                <strong data-document-tooltip-name></strong>
                <p data-document-tooltip-description></p>
              </div>
            </figure>
            <figure class="document-strip__item" data-document-id="documents.test.name">
              <figcaption class="document-strip__title" data-document-title></figcaption>
              <div class="document-strip__image-frame"><img src="./assets/documents/test.png" alt="" /></div>
              <div class="document-strip__quantity">
                <button type="button" data-document-decrement>−</button>
                <input type="number" min="0" step="1" value="0" data-document-quantity />
                <button type="button" data-document-increment>+</button>
              </div>
              <div class="document-strip__tooltip" role="tooltip">
                <strong data-document-tooltip-name></strong>
                <p data-document-tooltip-description></p>
              </div>
            </figure>
            <figure class="document-strip__item" data-document-id="documents.user.name">
              <figcaption class="document-strip__title" data-document-title></figcaption>
              <div class="document-strip__image-frame"><img src="./assets/documents/user.png" alt="" /></div>
              <div class="document-strip__quantity">
                <button type="button" data-document-decrement>−</button>
                <input type="number" min="0" step="1" value="0" data-document-quantity />
                <button type="button" data-document-increment>+</button>
              </div>
              <div class="document-strip__tooltip" role="tooltip">
                <strong data-document-tooltip-name></strong>
                <p data-document-tooltip-description></p>
              </div>
            </figure>
            <figure class="document-strip__item" data-document-id="documents.medical.name">
              <figcaption class="document-strip__title" data-document-title></figcaption>
              <div class="document-strip__image-frame"><img src="./assets/documents/medical.png" alt="" /></div>
              <div class="document-strip__quantity">
                <button type="button" data-document-decrement>−</button>
                <input type="number" min="0" step="1" value="0" data-document-quantity />
                <button type="button" data-document-increment>+</button>
              </div>
              <div class="document-strip__tooltip" role="tooltip">
                <strong data-document-tooltip-name></strong>
                <p data-document-tooltip-description></p>
              </div>
            </figure>
            <figure class="document-strip__item" data-document-id="documents.technical.name">
              <figcaption class="document-strip__title" data-document-title></figcaption>
              <div class="document-strip__image-frame"><img src="./assets/documents/technical.png" alt="" /></div>
              <div class="document-strip__quantity">
                <button type="button" data-document-decrement>−</button>
                <input type="number" min="0" step="1" value="0" data-document-quantity />
                <button type="button" data-document-increment>+</button>
              </div>
              <div class="document-strip__tooltip" role="tooltip">
                <strong data-document-tooltip-name></strong>
                <p data-document-tooltip-description></p>
              </div>
            </figure>
            <figure class="document-strip__item document-strip__item--classified" data-document-id="documents.classified.name">
              <figcaption class="document-strip__title" data-document-title></figcaption>
              <div class="document-strip__image-frame"><img src="./assets/documents/classified.png" alt="" /></div>
              <div class="document-strip__quantity">
                <button type="button" data-document-decrement>−</button>
                <input type="number" min="0" step="1" value="0" data-document-quantity />
                <button type="button" data-document-increment>+</button>
              </div>
              <div class="document-strip__tooltip" role="tooltip">
                <strong data-document-tooltip-name></strong>
                <p data-document-tooltip-description></p>
              </div>
            </figure>
          </div>
        </section>
      </main>
    </div>
    <script type="module">
      import SlimSelect from 'slim-select';
      import 'slim-select/styles';
      import englishFlagUrl from 'flag-icons/flags/4x3/gb.svg?no-inline';
      import { loadCatalogs } from './src/catalogs.ts';
      import { createLocalizer, formatAccessibleRequirements, formatCountdownUnit, formatNumber } from './src/localization.ts';
      import { browserCookieAdapter, restoreState, saveState } from './src/persistence.ts';
      import { reduceState } from './src/state.ts';

      const catalogs = await loadCatalogs();
      let state = restoreState(browserCookieAdapter, catalogs);
      const localizer = createLocalizer(catalogs.localization);
      const name = document.querySelector('[data-season-name]');
      const timer = document.querySelector('[data-season-timer]');
      const modeSelect = document.querySelector('[data-mode-select]');
      const languageSelect = document.querySelector('[data-language-select]');
      const endsAt = catalogs.battlePass.endsAt;
      const rewards = catalogs.battlePass.pages.flatMap((page) => page.rewards);
      const documentTotal = rewards.reduce(
        (total, reward) => total + reward.requirements.reduce((rewardTotal, requirement) => rewardTotal + requirement.quantity, 0),
        0,
      );
      const rewardTotal = rewards.length;
      const getClaimedDocumentQuantities = () => {
        const claimedRewards = new Set(state.claimedRewardIds);
        const quantities = {};
        rewards.forEach((reward) => {
          if (!claimedRewards.has(reward.id)) return;
          reward.requirements.forEach(({ documentId, quantity }) => {
            quantities[documentId] = (quantities[documentId] ?? 0) + quantity;
          });
        });
        return quantities;
      };

      name.textContent = localizer.text(catalogs.battlePass.id);
      timer.dateTime = new Date(endsAt * 1000).toISOString();

      const configureProgress = ({ labelId, labelSelector, currentSelector, totalSelector, progressSelector, total }) => {
        const label = localizer.text(labelId);
        const progress = document.querySelector(progressSelector);
        const current = document.querySelector(currentSelector);
        document.querySelector(labelSelector).textContent = label;
        document.querySelector(totalSelector).textContent = formatNumber(total, localizer.locale);
        progress.max = total;
        progress.setAttribute('aria-label', label);
        return (value) => {
          const boundedValue = Math.min(total, Math.max(0, value));
          current.textContent = formatNumber(boundedValue, localizer.locale);
          progress.value = boundedValue;
        };
      };

      const updateDocumentProgress = configureProgress({
        labelId: 'battlePass.documents',
        labelSelector: '[data-document-progress-label]',
        currentSelector: '[data-document-progress-current]',
        totalSelector: '[data-document-progress-total]',
        progressSelector: '[data-document-progress]',
        total: documentTotal,
      });
      const updateRewardProgress = configureProgress({
        labelId: 'battlePass.rewards',
        labelSelector: '[data-reward-progress-label]',
        currentSelector: '[data-reward-progress-current]',
        totalSelector: '[data-reward-progress-total]',
        progressSelector: '[data-reward-progress]',
        total: rewardTotal,
      });

      const refreshProgress = () => {
        const claimedDocumentTotal = Object.values(getClaimedDocumentQuantities())
          .reduce((total, quantity) => total + quantity, 0);
        const ownedDocumentTotal = catalogs.documents.documents.reduce((total, documentRecord) => {
          const quantity = documentRecord.kind === 'classified'
            ? state.classifiedDocuments
            : state.ownedDocuments[documentRecord.id] ?? 0;
          return total + quantity;
        }, 0);
        updateDocumentProgress(claimedDocumentTotal + ownedDocumentTotal);
        updateRewardProgress(state.claimedRewardIds.length);
      };

      let refreshRewardRail = () => {};
      const dispatch = (action) => {
        state = reduceState(state, action, catalogs);
        try {
          saveState(state, browserCookieAdapter);
        } catch (error) {
          console.error(error);
        }
        refreshProgress();
        refreshRewardRail();
      };

      refreshProgress();

      document.querySelector('[data-route-profile-label]').textContent = localizer.text('ui.routePreference');
      document.querySelector('[data-fastest-label]').textContent = localizer.text('optimizer.fastest');
      document.querySelector('[data-safest-label]').textContent = localizer.text('optimizer.safest');
      document.querySelectorAll('input[name="route-profile"]').forEach((input) => {
        input.checked = input.value === state.selectedProfile;
        input.addEventListener('change', () => {
          if (input.checked) dispatch({ type: 'set-profile', profile: input.value });
        });
      });

      const rewardHeading = document.querySelector('[data-reward-heading]');
      const claimAllButton = document.querySelector('[data-reward-claim-all]');
      const clearAllButton = document.querySelector('[data-reward-clear-all]');
      const rewardPages = document.querySelector('[data-reward-pages]');
      const documentNames = Object.fromEntries(catalogs.documents.documents.map((documentRecord) => [documentRecord.id, localizer.text(documentRecord.id)]));
      const documentAbbreviations = Object.fromEntries(Object.entries(documentNames).map(([documentId, documentName]) => [documentId, documentName.trim().split(/\s+/u)[0]]));
      const pageViews = catalogs.battlePass.pages.map((page) => {
        const pageSection = document.createElement('section');
        const trigger = document.createElement('button');
        const pageLabel = document.createElement('span');
        const claimedCount = document.createElement('span');
        const chevron = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        const chevronPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        const panel = document.createElement('div');
        const itemList = document.createElement('ul');
        const triggerId = `reward-page-trigger-${page.page}`;
        const panelId = `reward-page-panel-${page.page}`;

        pageSection.className = 'reward-page';
        trigger.className = 'reward-page__trigger';
        trigger.type = 'button';
        trigger.id = triggerId;
        trigger.setAttribute('aria-controls', panelId);
        pageLabel.className = 'reward-page__label';
        pageLabel.textContent = `${localizer.text('battlePass.page')} ${String(page.page).padStart(2, '0')}`;
        claimedCount.className = 'reward-page__count';
        chevron.classList.add('reward-page__chevron');
        chevron.setAttribute('viewBox', '0 0 12 8');
        chevron.setAttribute('aria-hidden', 'true');
        chevron.setAttribute('focusable', 'false');
        chevronPath.setAttribute('d', 'M1 1.25 6 6.25 11 1.25');
        chevronPath.setAttribute('fill', 'none');
        chevronPath.setAttribute('stroke', 'currentColor');
        chevronPath.setAttribute('stroke-width', '1.5');
        chevronPath.setAttribute('stroke-linecap', 'square');
        chevronPath.setAttribute('stroke-linejoin', 'miter');
        chevron.append(chevronPath);
        panel.className = 'reward-page__panel';
        panel.id = panelId;
        panel.setAttribute('role', 'region');
        panel.setAttribute('aria-labelledby', triggerId);
        itemList.className = 'reward-page__items';

        const rewardInputs = page.rewards.map((reward) => {
          const item = document.createElement('li');
          const label = document.createElement('label');
          const checkbox = document.createElement('input');
          const copy = document.createElement('span');
          const rewardName = document.createElement('span');
          const requirements = document.createElement('span');
          const fullName = localizer.text(reward.id);

          item.className = 'reward-item';
          checkbox.type = 'checkbox';
          checkbox.dataset.rewardId = reward.id;
          checkbox.setAttribute('aria-label', `${localizer.text('battlePass.claimReward')}: ${fullName}`);
          copy.className = 'reward-item__copy';
          rewardName.className = 'reward-item__name';
          rewardName.textContent = fullName;
          requirements.className = 'reward-item__requirements';
          requirements.textContent = reward.requirements.map(({ documentId, quantity }) => `${documentAbbreviations[documentId]} (${formatNumber(quantity, localizer.locale)})`).join(' · ');
          requirements.title = formatAccessibleRequirements(reward.requirements, documentNames, localizer.locale);
          copy.append(rewardName, requirements);
          label.append(checkbox, copy);
          item.append(label);
          itemList.append(item);

          checkbox.addEventListener('change', () => dispatch({ type: 'claim-reward', rewardId: reward.id, claimed: checkbox.checked }));
          return { rewardId: reward.id, checkbox };
        });

        trigger.append(pageLabel, claimedCount, chevron);
        trigger.addEventListener('click', () => dispatch({ type: 'set-page', page: page.page }));
        panel.append(itemList);
        pageSection.append(trigger, panel);
        rewardPages.append(pageSection);
        return { page, pageSection, trigger, panel, claimedCount, rewardInputs };
      });

      const crateReward = document.createElement('article');
      const crateRewardName = document.createElement('strong');
      const crateRewardRequirement = document.createElement('span');
      crateReward.className = 'reward-crate';
      crateRewardName.className = 'reward-item__name';
      crateRewardName.textContent = localizer.text('battlePass.blackDivisionCrate');
      crateRewardRequirement.className = 'reward-item__requirements';
      crateRewardRequirement.textContent = localizer.text('ui.anyRegularDocuments', {
        count: formatNumber(catalogs.optimizerRules.exchange.regularDocumentsPerBlackDivisionGearCrate, localizer.locale),
      });
      crateReward.append(crateRewardName, crateRewardRequirement);

      rewardHeading.textContent = localizer.text('battlePass.rewards');
      claimAllButton.textContent = localizer.text('battlePass.claimAll');
      clearAllButton.textContent = localizer.text('battlePass.clearAll');
      claimAllButton.addEventListener('click', () => dispatch({ type: 'claim-all', claimed: true }));
      clearAllButton.addEventListener('click', () => dispatch({ type: 'claim-all', claimed: false }));

      refreshRewardRail = () => {
        const claimedRewards = new Set(state.claimedRewardIds);
        const allRewardsClaimed = rewards.every((reward) => claimedRewards.has(reward.id));
        rewardPages.replaceChildren(...(allRewardsClaimed ? [crateReward] : pageViews.map(({ pageSection }) => pageSection)));
        claimAllButton.disabled = allRewardsClaimed;
        pageViews.forEach(({ page, trigger, panel, claimedCount, rewardInputs }) => {
          const selected = page.page === state.selectedPage;
          const claimedOnPage = rewardInputs.filter(({ rewardId }) => claimedRewards.has(rewardId)).length;
          trigger.setAttribute('aria-expanded', String(selected));
          panel.hidden = !selected;
          claimedCount.textContent = `${formatNumber(claimedOnPage, localizer.locale)} / ${formatNumber(page.rewards.length, localizer.locale)}`;
          rewardInputs.forEach(({ rewardId, checkbox }) => {
            checkbox.checked = claimedRewards.has(rewardId);
          });
        });
      };
      refreshRewardRail();

      const documentsById = new Map(catalogs.documents.documents.map((document) => [document.id, document]));
      document.querySelectorAll('[data-document-id]').forEach((tile, index) => {
        const documentId = tile.dataset.documentId;
        const documentRecord = documentsById.get(documentId);
        if (!documentRecord) throw new Error(`Unknown wireframe document: ${documentId}`);

        const fullName = localizer.text(documentRecord.id);
        const tooltip = tile.querySelector('.document-strip__tooltip');
        const quantityInput = tile.querySelector('[data-document-quantity]');
        const decrementButton = tile.querySelector('[data-document-decrement]');
        const incrementButton = tile.querySelector('[data-document-increment]');
        const tooltipId = `document-strip-tooltip-${index}`;
        tooltip.id = tooltipId;
        tile.querySelector('[data-document-title]').textContent = fullName.trim().split(/\s+/u)[0];
        tile.querySelector('img').alt = localizer.text(documentRecord.imageAltId);
        tile.querySelector('[data-document-tooltip-name]').textContent = fullName;
        tile.querySelector('[data-document-tooltip-description]').textContent = localizer.text(documentRecord.descriptionId);

        if (documentRecord.sourceLocationIds.length > 0) {
          const locationList = document.createElement('ul');
          documentRecord.sourceLocationIds.forEach((locationId) => {
            const location = document.createElement('li');
            location.textContent = localizer.text(locationId);
            locationList.append(location);
          });
          tooltip.append(locationList);
        }

        const quantityLabel = localizer.text('ui.quantity');
        quantityInput.setAttribute('aria-label', `${quantityLabel} ${fullName}`);
        decrementButton.setAttribute('aria-label', `${quantityLabel} − ${fullName}`);
        incrementButton.setAttribute('aria-label', `${quantityLabel} + ${fullName}`);
        [quantityInput, decrementButton, incrementButton].forEach((control) => control.setAttribute('aria-describedby', tooltipId));

        const readQuantity = () => documentRecord.kind === 'classified'
          ? state.classifiedDocuments
          : state.ownedDocuments[documentId] ?? 0;
        const setQuantity = (quantity) => {
          const normalizedQuantity = Math.max(0, Math.trunc(quantity));
          dispatch(documentRecord.kind === 'classified'
            ? { type: 'set-classified-documents', quantity: normalizedQuantity }
            : { type: 'set-owned-document', documentId, quantity: normalizedQuantity });
          quantityInput.value = String(readQuantity());
        };
        quantityInput.value = String(readQuantity());
        decrementButton.addEventListener('click', () => setQuantity(Number(quantityInput.value) - 1));
        incrementButton.addEventListener('click', () => setQuantity(Number(quantityInput.value) + 1));
        quantityInput.addEventListener('change', () => {
          const quantity = Number(quantityInput.value);
          setQuantity(Number.isFinite(quantity) ? quantity : 0);
        });
      });

      const modeData = [
        ['pvp-seasonal', 'mode.pvpSeasonal'],
        ['pvp', 'mode.pvp'],
        ['pve', 'mode.pve'],
      ].map(([mode, labelId]) => {
        const limit = formatNumber(catalogs.optimizerRules.dailyDocumentLimits[mode], localizer.locale);
        return {
          text: `${localizer.text(labelId)} · ${limit} / ${localizer.text('ui.day')}`,
          value: mode,
          selected: mode === state.mode,
        };
      });

      new SlimSelect({
        select: modeSelect,
        data: modeData,
        settings: {
          ariaLabel: localizer.text('optimizer.mode'),
          modal: 'off',
          showSearch: false,
        },
        events: {
          afterChange: (selection) => {
            const mode = selection[0]?.value;
            if (mode && mode !== state.mode) dispatch({ type: 'set-mode', mode });
          },
        },
      });

      const languageNames = new Intl.DisplayNames([localizer.locale], { type: 'language' });
      const englishName = languageNames.of('en') ?? 'en';
      const localeChoice = document.createElement('span');
      localeChoice.className = 'locale-choice';
      const localeFlag = document.createElement('img');
      localeFlag.className = 'locale-choice__flag';
      localeFlag.src = englishFlagUrl;
      localeFlag.alt = '';
      const localeName = document.createElement('span');
      localeName.className = 'locale-choice__name';
      localeName.textContent = englishName;
      localeChoice.append(localeFlag, localeName);

      new SlimSelect({
        select: languageSelect,
        data: [{ text: englishName, value: 'en', html: localeChoice.outerHTML, selected: true }],
        settings: {
          ariaLabel: localizer.text('ui.locale'),
          modal: 'off',
          showSearch: false,
        },
      });

      const updateTimer = () => {
        const totalSeconds = Math.max(0, Math.ceil(endsAt - Date.now() / 1000));
        if (totalSeconds === 0) {
          timer.textContent = localizer.text('season.ended');
          return false;
        }

        const days = Math.floor(totalSeconds / 86400);
        const hours = Math.floor((totalSeconds % 86400) / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const compact = `${days}d ${hours}h ${minutes}m`;
        const accessible = [
          formatCountdownUnit(days, localizer.locale, 'day'),
          formatCountdownUnit(hours, localizer.locale, 'hour'),
          formatCountdownUnit(minutes, localizer.locale, 'minute'),
        ].join(', ');
        timer.textContent = compact;
        timer.setAttribute('aria-label', localizer.text('season.countdown', { time: accessible }));
        return true;
      };

      if (updateTimer()) {
        const timerId = window.setInterval(() => {
          if (!updateTimer()) window.clearInterval(timerId);
        }, 1000);
      }
    </script>
  </body>
</html>
